<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>室女座超星系团 · 3D</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #container { position: fixed; inset: 0; cursor: grab; }
  #container.dragging { cursor: grabbing; }
  #info { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
          color: rgba(255,255,255,0.85); font: 600 16px sans-serif; letter-spacing: 2px;
          text-shadow: 0 2px 10px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; white-space: nowrap; }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
          color: rgba(255,255,255,0.45); font: 12px sans-serif; pointer-events: none; z-index: 10; white-space: nowrap; }
  #tooltip { position: fixed; background: rgba(20,22,28,0.95); color: #fff; padding: 10px 14px;
             border-radius: 8px; font-size: 13px; pointer-events: none; display: none; z-index: 100;
             border: 1px solid rgba(255,255,255,0.15); max-width: 300px; line-height: 1.5; }
  #close-btn { position: fixed; top: 14px; right: 16px; padding: 8px 16px;
               background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
               border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer; z-index: 20; font-weight: 600; }
  #close-btn:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div id="container"></div>
<div id="info">🔭 室女座星系团 · 3D (2099 颗星系)</div>
<div id="hint">🖱 左键拖动: 平移 · 右键拖动: 旋转 · 滚轮: 缩放 · 点击星系看信息</div>
<div id="tooltip"></div>
<button id="close-btn">← 返回地球</button>

<script src="three.min.js"></script>
<script src="CSS2DRenderer.js"></script>
<script>
// ── 室女座超星系团 3D 模型 (粒子云, 类似本星系群) ──
let VIRGO_DATA = [];
fetch('data/virgo_3d.json').then(r=>r.json()).then(d => {
  VIRGO_DATA = d;
  init();
});

const container = document.getElementById('container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000006);

// 星空背景
const starField = new THREE.Points(
  new THREE.BufferGeometry(),
  new THREE.PointsMaterial({ color: 0x8899bb, size: 1.0, sizeAttenuation: false, transparent: true, opacity: 0.7 })
);
{
  const count = 2500, pos = new Float32Array(count*3);
  for (let i=0;i<count;i++){
    const r = 200 + Math.random()*300;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
  }
  starField.geometry.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(starField);
}

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 10000);
camera.position.set(0, 8, 18);
camera.lookAt(-6, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.inset = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const LABEL_STYLE = { fontSize:'12px', color:'#fff', background:'rgba(15,20,30,0.7)', padding:'2px 8px',
  borderRadius:'10px', border:'1px solid rgba(120,180,255,0.4)', whiteSpace:'nowrap',
  fontFamily:'sans-serif', letterSpacing:'0.5px', userSelect:'none', pointerEvents:'auto' };
function makeLabel(text, target) {
  const el = document.createElement('div');
  el.textContent = text;
  Object.assign(el.style, LABEL_STYLE);
  const label = new THREE.CSS2DObject(el);
  label.position.set(0,0,0);
  target.add(label);
  return label;
}

const GROUP = new THREE.Group();
scene.add(GROUP);

// X-ray 气体晕 (模拟室女团真实的 X 射线高温气体, 巨大椭圆晕)
{
  const gasGeo = new THREE.SphereGeometry(10, 48, 48);
  const gasMat = new THREE.MeshBasicMaterial({
    color: 0xff8866, transparent: true, opacity: 0.03, depthWrite: false, side: THREE.BackSide
  });
  const gas = new THREE.Mesh(gasGeo, gasMat);
  gas.scale.set(1.4, 0.6, 1.0);
  GROUP.add(gas);
}

// 粒子云生成器 (复用本星系群算法)
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0xffffffff; };
}
function gaussRand(r) {
  let u1 = r(), u2 = r();
  while (u1 < 1e-6) u1 = r();
  return Math.sqrt(-2*Math.log(u1)) * Math.cos(2*Math.PI*u2);
}

function makeGalaxyParticles(cls, radius, seed, profile=null) {
  const r = rng(seed);
  const group = new THREE.Group();
  const isMajor = radius > 0.3;
  const p = profile || {};
  const arms_n = p.arms !== undefined ? p.arms : (cls === 'spiral' ? (isMajor ? 4 : 2) : 0);
  const winding = p.winding !== undefined ? p.winding : 1.0;
  const diskThickness = p.diskThickness !== undefined ? p.diskThickness : (cls === 'elliptical' ? 0.6 : 0.08);
  const bulgeRel = p.bulgeRel !== undefined ? p.bulgeRel : (cls === 'elliptical' ? 1.0 : 0.13);
  const irregular = !!p.irregular;
  const elliptical = !!p.elliptical || cls === 'elliptical';

  let positions = [], colors = [];
  const bulgeCount = isMajor ? 100 : 25;
  const armCount = isMajor ? (arms_n * 60) : (arms_n * 25);
  const diskCount = isMajor ? 220 : 70;
  const haloCount = isMajor ? 80 : 25;
  function pushParticle(x, y, z, color) {
    positions.push(x, y, z); colors.push(color.r, color.g, color.b);
  }
  for (let i = 0; i < bulgeCount; i++) {
    const g1 = gaussRand(r), g2 = gaussRand(r), g3 = gaussRand(r);
    const rb = radius * bulgeRel;
    const yScale = elliptical ? 0.7 : 0.5;
    pushParticle(g1*rb, g2*rb*yScale, g3*rb,
      new THREE.Color(r()<0.5 ? 0xfff0c0 : 0xffd89a).multiplyScalar(0.8+r()*0.3));
  }
  if (arms_n > 0 && !irregular) {
    for (let i = 0; i < armCount; i++) {
      const ai = Math.floor(r()*arms_n);
      const rNorm = Math.pow(r(), 0.7);
      const rArm = radius*0.18 + rNorm*radius*1.5;
      if (rArm > radius*1.8) continue;
      const baseAngle = (ai*2*Math.PI/arms_n);
      const spiralOffset = (rNorm*winding*Math.PI);
      const armAngle = baseAngle + spiralOffset;
      const spreadAcross = (r()-0.5)*0.8;
      const th = armAngle + spreadAcross;
      const x = rArm*Math.cos(th), z = rArm*Math.sin(th);
      const y = gaussRand(r)*diskThickness*radius*0.3;
      const col = new THREE.Color(rNorm<0.4 ? 0xc8d8ff : (rNorm<0.7 ? 0xeae8e0 : 0xffd89a))
        .multiplyScalar(0.5+r()*0.4);
      pushParticle(x, y, z, col);
    }
  }
  if (irregular) {
    const irrCount = isMajor ? 160 : 60;
    for (let i = 0; i < irrCount; i++) {
      const ph = r()*Math.PI*2;
      const rdist = Math.pow(r(), 0.6)*radius*1.3;
      const y = gaussRand(r)*diskThickness*radius*0.5;
      const x = rdist*Math.cos(ph)*(1+r()*0.3);
      const z = rdist*Math.sin(ph)*(0.6+r()*0.4);
      pushParticle(x, y, z, new THREE.Color(0xc8d8ff).multiplyScalar(0.45+r()*0.4));
    }
  }
  for (let i = 0; i < diskCount; i++) {
    const rNorm = Math.pow(r(), 0.5);
    const rDisk = radius*0.2 + rNorm*radius*1.6;
    if (rDisk > radius*1.9) continue;
    const th = r()*Math.PI*2;
    const x = rDisk*Math.cos(th), z = rDisk*Math.sin(th);
    const y = gaussRand(r)*diskThickness*radius*0.5;
    let col;
    if (elliptical) col = new THREE.Color(0xffd8a0);
    else if (irregular) col = new THREE.Color(0xc8d8ff);
    else col = new THREE.Color(rNorm<0.5 ? 0xc8d8ff : 0xfff0e0);
    col.multiplyScalar(0.3+r()*0.4);
    pushParticle(x, y, z, col);
  }
  for (let i = 0; i < haloCount; i++) {
    const rdist = Math.pow(r(), 0.7)*radius*2.5;
    const th = r()*Math.PI*2, ph = (r()-0.5)*Math.PI;
    const x = rdist*Math.sin(ph)*Math.cos(th);
    const y = rdist*Math.cos(ph)*(elliptical ? 0.5 : 0.3);
    const z = rdist*Math.sin(ph)*Math.sin(th);
    let col;
    if (elliptical) col = new THREE.Color(0xffd8a0);
    else if (irregular) col = new THREE.Color(0xa0b8d8);
    else col = new THREE.Color(r()<0.6 ? 0xc8d8ff : 0xfff0e0);
    col.multiplyScalar(0.25+r()*0.3);
    pushParticle(x, y, z, col);
  }
  const N = positions.length/3;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.04, sizeAttenuation: true, vertexColors: true,
    transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.NormalBlending,
    map: (()=>{ const c=document.createElement('canvas'); c.width=c.height=16;
      const g=c.getContext('2d'); const gr=g.createRadialGradient(8,8,0,8,8,8);
      gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.5,'rgba(255,255,255,0.4)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=gr; g.fillRect(0,0,16,16); return new THREE.CanvasTexture(c); })()
  });
  group.add(new THREE.Points(geo, mat));
  return { group, count: N };
}

// 室女团星系形态分布: 多数是椭圆/矮椭圆 (E/S0), 少数旋涡, 部分不规则
function classifyVirgo(g) {
  if (g.type === 'major') {
    if (g.name === 'M87') return 'elliptical';
    return 'elliptical';
  }
  return 'dwarf';
}

// 渲染
const clickables = [];
function init() {
  const MAJOR_LABEL = new Set(['M87','M86','M84','M49','M60','M58','M59','M61','M90','M91','M98','M99','M100','NGC4388','NGC4438','NGC4473','NGC4552']);

  VIRGO_DATA.forEach((g, idx) => {
    const cls = classifyVirgo(g);
    const d = Math.sqrt(g.x*g.x+g.y*g.y+g.z*g.z) || 0.5;
    let radius;
    if (g.type === 'major') {
      // 著名星系: M87 最大, 其他中等
      radius = g.name === 'M87' ? 0.55 : 0.32;
    } else {
      // 矮星系: 随距离衰减
      radius = Math.max(0.06, 0.18 - d*0.04);
    }
    // 椭圆参数
    const profile = {
      arms: 0, winding: 0, diskThickness: 0.5,
      bulgeRel: cls === 'elliptical' ? 1.0 : 0.8,
      elliptical: true
    };
    const { group } = makeGalaxyParticles(cls, radius, idx*31+7, profile);
    // 不压扁 (X-ray 气体已经压扁, 星系本身保持球状)
    const tiltX = 0, tiltY = 0, yScale = 1;
    group.scale.set(1, yScale, 1);
    group.rotation.set(tiltX, tiltY, 0);
    group.position.set(g.x, g.y, g.z);
    GROUP.add(group);

    if (MAJOR_LABEL.has(g.name)) makeLabel(g.name, group);
    clickables.push({ mesh: group, info: {
      name: g.name, sub: g.subtype || '矮星系',
      rows: [`距 M87 ${d.toFixed(2)} Mpc`, `赤经 ${g.ra?.toFixed(2)}° · 赤纬 ${g.dec?.toFixed(2)}°`]
    }});
  });
}

// ── 交互 (左平移/右旋转/滚轮缩放) ──
let action = null, prevX = 0, prevY = 0;
const panTarget = new THREE.Vector3(-6, 0, 0);
let rotY = 0.9, rotX = 0.45, viewDist = 22;
container.addEventListener('contextmenu', e => e.preventDefault());
container.addEventListener('mousedown', e => {
  action = (e.button === 2) ? 'rotate' : 'pan';
  prevX = e.clientX; prevY = e.clientY;
  container.classList.add('dragging');
});
window.addEventListener('mouseup', () => { action = null; container.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  if (!action) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  if (action === 'rotate') {
    rotY += dx * 0.005;
    rotX = Math.max(-1.45, Math.min(1.45, rotX + dy*0.005));
  } else {
    const s = viewDist * 0.0022;
    const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
    panTarget.addScaledVector(right, -dx*s);
    panTarget.addScaledVector(up, dy*s);
  }
  prevX = e.clientX; prevY = e.clientY;
});
container.addEventListener('wheel', e => {
  e.preventDefault();
  viewDist *= (e.deltaY > 0 ? 1.1 : 0.9);
  viewDist = Math.max(5, Math.min(120, viewDist));
}, { passive: false });

// 拾取
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
container.addEventListener('click', e => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left)/rect.width)*2 - 1;
  mouse.y = -((e.clientY - rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickables.map(c=>c.mesh), true);
  if (hits.length > 0) {
    const obj = hits[0].object;
    const entry = clickables.find(c => c.mesh === obj || (c.mesh.children||[]).includes(obj));
    if (entry) showInfo(entry.info);
  }
});
function showInfo(info) {
  tooltip.style.display = 'block';
  tooltip.style.left = '50%'; tooltip.style.top = '55%'; tooltip.style.transform = 'translateX(-50%)';
  tooltip.innerHTML = `<b style="font-size:15px;">${info.name}</b> · ${info.sub}<br>
    <span style="color:#aac;font-size:12px;line-height:1.5;">${info.rows.join('<br>')}</span>`;
  setTimeout(()=> tooltip.style.display = 'none', 5000);
}

function animate() {
  requestAnimationFrame(animate);
  const dist = camera.position.distanceTo(panTarget);
  camera.position.set(
    panTarget.x + dist*Math.sin(rotY)*Math.cos(rotX),
    panTarget.y + dist*Math.sin(rotX),
    panTarget.z + dist*Math.cos(rotY)*Math.cos(rotX)
  );
  camera.lookAt(panTarget);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('close-btn').onclick = () => {
  if (window.parent) window.parent.postMessage({ type: 'close-virgo-3d' }, '*');
};
</script>
</body>
</html>
