<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>可观测宇宙 · 3D</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #container { position: fixed; inset: 0; cursor: grab; }
  #container.dragging { cursor: grabbing; }
  #info { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
          color: rgba(255,255,255,0.85); font: 600 16px sans-serif; letter-spacing: 2px;
          text-shadow: 0 2px 10px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; white-space: nowrap; }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
          color: rgba(255,255,255,0.45); font: 12px sans-serif; pointer-events: none; z-index: 10; white-space: nowrap; }
  #tooltip { position: fixed; background: rgba(20,22,28,0.95); color: #fff; padding: 10px 14px;
             border-radius: 8px; font-size: 13px; pointer-events: none; display: none; z-index: 100;
             border: 1px solid rgba(255,255,255,0.15); max-width: 320px; line-height: 1.5; }
  #focus-hint { position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
                color: #fff; font: 600 13px sans-serif; text-shadow: 0 2px 8px rgba(0,0,0,0.9);
                display: none; z-index: 30; background: rgba(20,22,28,0.8);
                padding: 5px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); }
  #close-btn { position: fixed; top: 14px; right: 16px; padding: 8px 16px;
               background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
               border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer; z-index: 20; font-weight: 600; }
  #close-btn:hover { background: rgba(255,255,255,0.2); }
  #scale-tip { position: fixed; top: 50px; left: 14px; color: rgba(255,220,150,0.85);
               font: 11px sans-serif; z-index: 10; background: rgba(20,22,28,0.65);
               padding: 6px 10px; border-radius: 6px; pointer-events: none;
               border: 1px solid rgba(255,220,150,0.25); line-height: 1.7; max-width: 240px; }
</style>
</head>
<body>
<div id="container"></div>
<div id="info">🌐 可观测宇宙 · 3D (2MRS 18856 颗真实星系 + 12 大尺度结构 + 11 著名星系)</div>
<div id="hint">🖱 左键平移 · 右键旋转(看3D透视) · 滚轮缩放 · 点击结构聚焦</div>
<div id="scale-tip">
  <b>尺度:</b> 1 单位 = 100 Mpc<br>
  · 内核: 2MRS 真实星系 (≤107 Mpc)<br>
  · 外层结构: 对数压缩, 0.00003~46.5 Gly<br>
  · 最外层球壳: 可观测宇宙边缘
</div>
<div id="tooltip"></div>
<div id="focus-hint"></div>
<button id="close-btn">← 返回地球</button>

<script src="three.min.js"></script>
<script src="CSS2DRenderer.js"></script>
<script>
let GALAXIES = null;
let STRUCTURES = null;
Promise.all([
  fetch('data/laniakea_spherical.json').then(r => r.json()),
  fetch('data/observable_structures.json').then(r => r.json())
]).then(([g, s]) => {
  GALAXIES = g.galaxies;
  STRUCTURES = s;
  init();
});

const container = document.getElementById('container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000006);

// 星空背景
const starField = new THREE.Points(
  new THREE.BufferGeometry(),
  new THREE.PointsMaterial({ color: 0x8899bb, size: 1.0, sizeAttenuation: false, transparent: true, opacity: 0.5 })
);
{
  const count = 2500, pos = new Float32Array(count*3);
  for (let i=0;i<count;i++){
    const r = 300 + Math.random()*400;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
  }
  starField.geometry.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(starField);
}

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100000);
camera.position.set(60, 90, 180);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.inset = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const LABEL_STYLE = {
  fontSize:'13px', color:'#fff', background:'rgba(15,20,30,0.75)', padding:'3px 10px',
  borderRadius:'12px', border:'1px solid rgba(255,200,100,0.5)', whiteSpace:'nowrap',
  fontFamily:'sans-serif', letterSpacing:'0.5px', userSelect:'none', pointerEvents:'auto',
  textShadow:'0 1px 4px rgba(0,0,0,0.9)', cursor:'pointer',
  transition:'transform 0.15s, box-shadow 0.15s', touchAction:'manipulation'
};
// 大尺度结构标签: 更大更亮， hover 效果
const BIG_LABEL_STYLE = {
  fontSize:'14px', padding:'6px 14px', fontWeight:'700',
  background:'linear-gradient(135deg, rgba(20,25,40,0.92), rgba(30,35,55,0.92))',
  boxShadow:'0 2px 12px rgba(0,0,0,0.6)'
};
function makeLabel(text, color, target, fontSize='13px', bold=false, onClick=null) {
  const el = document.createElement('div');
  el.textContent = text;
  Object.assign(el.style, LABEL_STYLE, {
    fontSize, color, border: `1px solid ${color}80`
  });
  if (bold) el.style.fontWeight = '700';
  // hover 放大效果
  el.addEventListener('mouseenter', () => {
    el.style.transform = 'scale(1.15)';
    el.style.boxShadow = `0 4px 20px ${color}60`;
  });
  el.addEventListener('mouseleave', () => {
    el.style.transform = 'scale(1)';
    el.style.boxShadow = 'none';
  });
  // 点击事件 (pointerdown 比 click 更可靠, 不依赖 mousedown+mouseup 完整序列)
  if (onClick) {
    let downX = 0, downY = 0, isDrag = false;
    el.addEventListener('pointerdown', (e) => {
      downX = e.clientX; downY = e.clientY; isDrag = false;
    });
    el.addEventListener('pointermove', (e) => {
      if (Math.abs(e.clientX - downX) > 5 || Math.abs(e.clientY - downY) > 5) isDrag = true;
    });
    el.addEventListener('pointerup', (e) => {
      if (!isDrag) { e.stopPropagation(); onClick(); }
    });
    // click 作为兑底 (某些浏览器/触屏可能不发 pointer 事件)
    el.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
  }
  const label = new THREE.CSS2DObject(el);
  label.position.set(0, 1.5, 0);
  target.add(label);
  return label;
}

const GROUP = new THREE.Group();
scene.add(GROUP);

// 距离映射: log scale
function distToUnits(d_gly) {
  const d_min = 1e-5;
  const d_max = 46.5;
  if (d_gly < d_min) d_gly = d_min;
  if (d_gly > d_max) return -1;
  const log_d = Math.log10(d_gly);
  const t = (log_d - (-5)) / (1.67 - (-5));
  return 6 + t * 120;
}

function celestialToXYZ(ra_deg, dec_deg, d_gly) {
  const r = distToUnits(d_gly);
  if (r < 0) return null;
  const ra = ra_deg * Math.PI / 180;
  const dec = dec_deg * Math.PI / 180;
  return {
    x: r * Math.cos(dec) * Math.cos(ra),
    y: r * Math.cos(dec) * Math.sin(ra),
    z: r * Math.sin(dec)
  };
}

function makeDotTexture(rgb, alpha=1) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32,32,0,32,32,32);
  const [r,b,bb] = rgb;
  gr.addColorStop(0, `rgba(${r},${b},${bb},${alpha})`);
  gr.addColorStop(0.4, `rgba(${r},${b},${bb},${alpha*0.6})`);
  gr.addColorStop(1, `rgba(${r},${b},${bb},0)`);
  g.fillStyle = gr;
  g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}

function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0xffffffff; };
}
function gaussRand(r) {
  let u1 = r(), u2 = r();
  while (u1 < 1e-6) u1 = r();
  return Math.sqrt(-2*Math.log(u1)) * Math.cos(2*Math.PI*u2);
}

// ── 通用粒子云 (cluster/supercluster 用) ──
// ── 工具: 生成 Points 对象 (传入位置+颜色数组, 颜色) ────────────
function makePoints(positions, colors, size, opacity, colorHex) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size, sizeAttenuation: true, vertexColors: true,
    transparent: true, opacity, depthWrite: false,
    map: makeDotTexture(colorHex ? [(colorHex>>16)&0xff,(colorHex>>8)&0xff,colorHex&0xff] : [200,210,240]),
    alphaTest: 0.01
  });
  return new THREE.Points(geo, mat);
}
// 工具: 生成一个明亮大星系 sprite
function makeGalaxySprite(x, y, z, color, size=1.5) {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    color, transparent: true, opacity: 0.95, depthWrite: false,
    map: makeDotTexture([(color.r*255)|0, (color.g*255)|0, (color.b*255)|0])
  }));
  sprite.scale.set(size, size, 1);
  sprite.position.set(x, y, z);
  return sprite;
}
// 工具: 生成一条 filament (两点之间的子云)
function makeFilament(x1, y1, z1, x2, y2, z2, width, seed, color, N=80) {
  const r = rng(seed);
  const positions = new Float32Array(N*3);
  const colors = new Float32Array(N*3);
  const dx = x2-x1, dy = y2-y1, dz = z2-z1;
  const base = new THREE.Color(color);
  for (let i = 0; i < N; i++) {
    const t = i / (N-1);
    const g1 = gaussRand(r) * width;
    const g2 = gaussRand(r) * width;
    const g3 = gaussRand(r) * width;
    positions[i*3]   = x1 + dx*t + g1;
    positions[i*3+1] = y1 + dy*t + g2;
    positions[i*3+2] = z1 + dz*t + g3;
    const c = base.clone().multiplyScalar(0.5 + r()*0.4);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  return makePoints(positions, colors, 0.3, 0.7, color);
}
// 工具: 生成一个小子团 (密集核心+几个星系)
function makeSubCluster(cx, cy, cz, size, seed, color, withBright=true) {
  const r = rng(seed);
  const group = new THREE.Group();
  // 核心粒子
  const N = 80;
  const positions = new Float32Array(N*3);
  const colors = new Float32Array(N*3);
  const base = new THREE.Color(color);
  for (let i = 0; i < N; i++) {
    const g1 = gaussRand(r) * size * 0.4;
    const g2 = gaussRand(r) * size * 0.3;
    const g3 = gaussRand(r) * size * 0.4;
    positions[i*3]   = cx + g1;
    positions[i*3+1] = cy + g2;
    positions[i*3+2] = cz + g3;
    const c = base.clone().multiplyScalar(0.5 + r()*0.4);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  group.add(makePoints(positions, colors, 0.3, 0.85, color));
  // 几个亮星系
  if (withBright) {
    const galaxyCount = 2 + Math.floor(r() * 3);
    for (let i = 0; i < galaxyCount; i++) {
      const g1 = gaussRand(r) * size * 0.35;
      const g2 = gaussRand(r) * size * 0.25;
      const g3 = gaussRand(r) * size * 0.35;
      const hueShift = r() < 0.5 ? -0.05 : 0.05;
      const c = base.clone().offsetHSL(hueShift, 0, 0.1);
      group.add(makeGalaxySprite(cx + g1, cy + g2, cz + g3, c, 0.6 + r()*0.4));
    }
  }
  return group;
}

// ── Cluster (本星系群/室女团): 密集核心 + 多个子团 + 潮汐流 ─────
function makeCluster(centerX, centerY, centerZ, radius, seed, color, N=300) {
  const r = rng(seed);
  const group = new THREE.Group();
  // 1. 主核心粒子
  const positions = new Float32Array(N*3);
  const colors = new Float32Array(N*3);
  const base = new THREE.Color(color);
  for (let i = 0; i < N; i++) {
    const g1 = gaussRand(r) * radius;
    const g2 = gaussRand(r) * radius * 0.6;
    const g3 = gaussRand(r) * radius;
    positions[i*3]   = centerX + g1;
    positions[i*3+1] = centerY + g2;
    positions[i*3+2] = centerZ + g3;
    const c = base.clone().multiplyScalar(0.4 + r()*0.5);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  group.add(makePoints(positions, colors, 0.35, 0.85, color));
  // 2. 几个亮大星系 (不同颜色) 作为标志
  const brightCount = 5 + Math.floor(r() * 4);
  for (let i = 0; i < brightCount; i++) {
    const g1 = gaussRand(r) * radius * 0.6;
    const g2 = gaussRand(r) * radius * 0.4;
    const g3 = gaussRand(r) * radius * 0.6;
    const c = base.clone().offsetHSL((r()-0.5)*0.1, 0.1, 0.15);
    group.add(makeGalaxySprite(centerX + g1, centerY + g2, centerZ + g3, c, 1.0 + r()*0.6));
  }
  // 3. 2-3 条潮汐流 (曲线粒子带)
  for (let s = 0; s < 2 + Math.floor(r()*2); s++) {
    const streamN = 100;
    const streamPos = new Float32Array(streamN*3);
    const streamCol = new Float32Array(streamN*3);
    const baseAng = r() * Math.PI * 2;
    const length = radius * (2.5 + r() * 1.5);
    for (let i = 0; i < streamN; i++) {
      const t = i / (streamN-1);
      const ang = baseAng + t * Math.PI * (0.3 + r()*0.4);
      const dist = t * length;
      const wob = Math.sin(t * 8) * radius * 0.15;
      streamPos[i*3]   = centerX + Math.cos(ang) * dist + (r()-0.5)*radius*0.15;
      streamPos[i*3+1] = centerY + (r()-0.5) * radius * 0.25;
      streamPos[i*3+2] = centerZ + Math.sin(ang) * dist + (r()-0.5)*radius*0.15;
      const c = base.clone().multiplyScalar(0.3 + t*0.4);
      streamCol[i*3]=c.r; streamCol[i*3+1]=c.g; streamCol[i*3+2]=c.b;
    }
    group.add(makePoints(streamPos, streamCol, 0.25, 0.6, color));
  }
  return group;
}

// ── Supercluster (超团): 多个子团 + filament 连成网状结构 ─────────
function makeSupercluster(centerX, centerY, centerZ, radius, seed, color, name='') {
  const r = rng(seed);
  const group = new THREE.Group();
  // 1. 背景粒子云 (弥散)
  const haloN = 400;
  const haloPos = new Float32Array(haloN*3);
  const haloCol = new Float32Array(haloN*3);
  const base = new THREE.Color(color);
  for (let i = 0; i < haloN; i++) {
    const g1 = gaussRand(r) * radius;
    const g2 = gaussRand(r) * radius * 0.4;
    const g3 = gaussRand(r) * radius;
    haloPos[i*3]   = centerX + g1;
    haloPos[i*3+1] = centerY + g2;
    haloPos[i*3+2] = centerZ + g3;
    const c = base.clone().multiplyScalar(0.3 + r()*0.3);
    haloCol[i*3]=c.r; haloCol[i*3+1]=c.g; haloCol[i*3+2]=c.b;
  }
  group.add(makePoints(haloPos, haloCol, 0.3, 0.6, color));
  // 2. 多个子团 (拉尼亚凯亚有 9 个超团, 史隆有多个 rich cluster)
  // 拉尼亚凯亚特殊: 9 个真实超团核心 (Virgo, Hydra-Centaurus, Pavo-Indus, etc.)
  let subCenters;
  if (name.includes('拉尼亚凯亚')) {
    // 拉尼亚凯亚 9 个真实超团核心 (相对位置)
    const ang9 = [0, 40, 80, 120, 160, 200, 240, 280, 320];
    subCenters = ang9.map((a, i) => {
      const ang = a * Math.PI / 180;
      const dist = radius * (0.3 + 0.5 * (i % 3) / 2);
      return {
        x: centerX + Math.cos(ang) * dist,
        y: centerY + (r() - 0.5) * radius * 0.2,
        z: centerZ + Math.sin(ang) * dist,
        size: radius * 0.25 * (0.7 + r() * 0.5)
      };
    });
  } else {
    // 通用: 3-5 个随机子团
    const subCount = 3 + Math.floor(r() * 3);
    subCenters = Array.from({length: subCount}, () => {
      const ang = r() * Math.PI * 2;
      const dist = r() * radius * 0.6;
      return {
        x: centerX + Math.cos(ang) * dist,
        y: centerY + (r() - 0.5) * radius * 0.3,
        z: centerZ + Math.sin(ang) * dist,
        size: radius * 0.2 * (0.6 + r() * 0.5)
      };
    });
  }
  for (const c of subCenters) {
    group.add(makeSubCluster(c.x, c.y, c.z, c.size, Math.floor(r()*99999), color, true));
  }
  // 3. 子团之间用 filament 连接
  for (let i = 0; i < subCenters.length; i++) {
    for (let j = i+1; j < subCenters.length; j++) {
      const a = subCenters[i], b = subCenters[j];
      const dist = Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2 + (a.z-b.z)**2);
      if (dist < radius * 1.5 && r() < 0.7) {
        group.add(makeFilament(a.x, a.y, a.z, b.x, b.y, b.z, radius*0.1, Math.floor(r()*99999), color, 60));
      }
    }
  }
  // 4. 几个亮大星系
  for (let i = 0; i < 4; i++) {
    const c = subCenters[Math.floor(r() * subCenters.length)];
    const g1 = gaussRand(r) * c.size * 0.3;
    const g2 = gaussRand(r) * c.size * 0.2;
    const g3 = gaussRand(r) * c.size * 0.3;
    const hueShift = (r() - 0.5) * 0.1;
    const col = base.clone().offsetHSL(hueShift, 0.1, 0.1);
    group.add(makeGalaxySprite(c.x + g1, c.y + g2, c.z + g3, col, 0.8 + r()*0.4));
  }
  return group;
}

// ── Wall (长城): 厚度可见的 flat sheet + 子团 + 垂直 filament ──────
function makeWall(centerX, centerY, centerZ, length, thickness, dirDeg, seed, color, name='') {
  const r = rng(seed);
  const group = new THREE.Group();
  const dir = dirDeg * Math.PI / 180;
  const base = new THREE.Color(color);
  // 1. 主体 sheet: 多行粒子 (5-7 行表示厚度)
  const rowCount = 5 + Math.floor(r() * 3);
  for (let row = 0; row < rowCount; row++) {
    const rowOffset = (row / (rowCount-1) - 0.5) * thickness;
    const N = 200;
    const positions = new Float32Array(N*3);
    const colors = new Float32Array(N*3);
    for (let i = 0; i < N; i++) {
      const along = (r() - 0.5) * length;
      const across = rowOffset + (r() - 0.5) * thickness * 0.2;
      const vertical = (r() - 0.5) * thickness * 0.15;
      const x = along * Math.cos(dir) - across * Math.sin(dir);
      const z = along * Math.sin(dir) + across * Math.cos(dir);
      positions[i*3]   = centerX + x;
      positions[i*3+1] = centerY + vertical;
      positions[i*3+2] = centerZ + z;
      // 越靠中间行越亮 (厚度梯度)
      const rowFactor = 1 - Math.abs(row/(rowCount-1) - 0.5) * 1.5;
      const c = base.clone().multiplyScalar((0.4 + r()*0.4) * Math.max(0.2, rowFactor));
      colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
    }
    group.add(makePoints(positions, colors, 0.3, 0.7, color));
  }
  // 2. 几个子团 (rich cluster) 沿着长轴
  const subCount = 4 + Math.floor(r() * 4);
  for (let i = 0; i < subCount; i++) {
    const along = (r() - 0.5) * length * 0.85;
    const across = (r() - 0.5) * thickness * 1.5;
    const x = along * Math.cos(dir) - across * Math.sin(dir);
    const z = along * Math.sin(dir) + across * Math.cos(dir);
    const subSize = thickness * (1.5 + r() * 1.5);
    group.add(makeSubCluster(centerX + x, centerY + (r()-0.5)*thickness*0.3, centerZ + z, subSize, Math.floor(r()*99999), color, true));
  }
  // 3. 垂直 filament (分支)
  for (let i = 0; i < 3; i++) {
    const along = (r() - 0.5) * length * 0.7;
    const x = along * Math.cos(dir);
    const z = along * Math.sin(dir);
    const perpDir = dir + Math.PI/2;
    const perpLen = thickness * (3 + r() * 4);
    const px = Math.cos(perpDir) * perpLen;
    const pz = Math.sin(perpDir) * perpLen;
    group.add(makeFilament(centerX + x, centerY, centerZ + z, centerX + x + px, centerY, centerZ + z + pz, thickness*0.2, Math.floor(r()*99999), color, 50));
  }
  return group;
}

// ── Arc (弧): 多条平行弧线 + 沿弧子团 ─────────
function makeArc(centerX, centerY, centerZ, radius, sweepDeg, dirDeg, thickness, seed, color, N=400) {
  const r = rng(seed);
  const group = new THREE.Group();
  const base = new THREE.Color(color);
  const startA = -sweepDeg/2 * Math.PI/180;
  const endA = sweepDeg/2 * Math.PI/180;
  const dir = dirDeg * Math.PI / 180;
  // 多条平行弧线 (3-5 条, 形成厚度)
  const lineCount = 3 + Math.floor(r() * 3);
  for (let line = 0; line < lineCount; line++) {
    const offset = (line - (lineCount-1)/2) * thickness * 0.5;
    const positions = new Float32Array(N*3);
    const colors = new Float32Array(N*3);
    for (let i = 0; i < N; i++) {
      const t = i / (N-1);
      const ang = startA + t * (endA - startA);
      const dist = radius + offset + (r() - 0.5) * thickness * 0.3;
      const x = dist * Math.cos(ang);
      const z = dist * Math.sin(ang);
      const y = (r() - 0.5) * thickness * 0.3;
      const rx = x * Math.cos(dir) - z * Math.sin(dir);
      const rz = x * Math.sin(dir) + z * Math.cos(dir);
      positions[i*3]   = centerX + rx;
      positions[i*3+1] = centerY + y;
      positions[i*3+2] = centerZ + rz;
      const c = base.clone().multiplyScalar(0.4 + r()*0.5);
      colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
    }
    group.add(makePoints(positions, colors, 0.3, 0.7, color));
  }
  // 沿弧几个子团
  const subCount = 3 + Math.floor(sweepDeg / 30);
  for (let i = 0; i < subCount; i++) {
    const t = (i + 0.5) / subCount;
    const ang = startA + t * (endA - startA);
    const dist = radius + (r()-0.5) * thickness;
    const x = dist * Math.cos(ang);
    const z = dist * Math.sin(ang);
    const rx = x * Math.cos(dir) - z * Math.sin(dir);
    const rz = x * Math.sin(dir) + z * Math.cos(dir);
    group.add(makeSubCluster(centerX + rx, centerY + (r()-0.5)*thickness*0.5, centerZ + rz, thickness*1.2, Math.floor(r()*99999), color, true));
  }
  return group;
}

// ── Ring (GRB 大环): 完整 360° 多重圆环 + 径向 filament ────────
function makeRing(centerX, centerY, centerZ, radius, thickness, seed, color, N=600) {
  const r = rng(seed);
  const group = new THREE.Group();
  const base = new THREE.Color(color);
  // 主环
  const positions = new Float32Array(N*3);
  const colors = new Float32Array(N*3);
  for (let i = 0; i < N; i++) {
    const t = i / N * Math.PI * 2;
    const dist = radius + gaussRand(r) * thickness * 0.3;
    const x = dist * Math.cos(t);
    const z = dist * Math.sin(t);
    const y = gaussRand(r) * thickness * 0.3;
    positions[i*3]   = centerX + x;
    positions[i*3+1] = centerY + y;
    positions[i*3+2] = centerZ + z;
    const c = base.clone().multiplyScalar(0.4 + r()*0.4);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  group.add(makePoints(positions, colors, 0.3, 0.85, color));
  // 外环 (稍微大一点)
  const N2 = Math.floor(N * 0.5);
  const positions2 = new Float32Array(N2*3);
  const colors2 = new Float32Array(N2*3);
  for (let i = 0; i < N2; i++) {
    const t = i / N2 * Math.PI * 2;
    const dist = radius * 1.15 + gaussRand(r) * thickness * 0.4;
    const x = dist * Math.cos(t);
    const z = dist * Math.sin(t);
    const y = gaussRand(r) * thickness * 0.2;
    positions2[i*3]   = centerX + x;
    positions2[i*3+1] = centerY + y;
    positions2[i*3+2] = centerZ + z;
    const c = base.clone().multiplyScalar(0.3 + r()*0.3);
    colors2[i*3]=c.r; colors2[i*3+1]=c.g; colors2[i*3+2]=c.b;
  }
  group.add(makePoints(positions2, colors2, 0.25, 0.5, color));
  // 沿环 8 个子团
  for (let i = 0; i < 8; i++) {
    const t = i / 8 * Math.PI * 2;
    const dist = radius;
    const x = dist * Math.cos(t);
    const z = dist * Math.sin(t);
    group.add(makeSubCluster(centerX + x, centerY, centerZ + z, thickness*1.5, Math.floor(r()*99999), color, true));
  }
  return group;
}

// ── LQG: 离散亮类星体 + 背景粒子 ────────
function makeLQG(centerX, centerY, centerZ, spread, seed, color, N=200) {
  const r = rng(seed);
  const group = new THREE.Group();
  const base = new THREE.Color(color);
  // 背景 (偏少)
  const bgN = Math.floor(N * 0.6);
  const bgPos = new Float32Array(bgN*3);
  const bgCol = new Float32Array(bgN*3);
  for (let i = 0; i < bgN; i++) {
    const g1 = gaussRand(r) * spread;
    const g2 = gaussRand(r) * spread * 0.4;
    const g3 = gaussRand(r) * spread;
    bgPos[i*3]   = centerX + g1;
    bgPos[i*3+1] = centerY + g2;
    bgPos[i*3+2] = centerZ + g3;
    const c = base.clone().multiplyScalar(0.4 + r()*0.3);
    bgCol[i*3]=c.r; bgCol[i*3+1]=c.g; bgCol[i*3+2]=c.b;
  }
  group.add(makePoints(bgPos, bgCol, 0.3, 0.6, color));
  // 明亮类星体 sprite (稀疏但亮)
  const quasarCount = 8 + Math.floor(r() * 6);
  for (let i = 0; i < quasarCount; i++) {
    const g1 = gaussRand(r) * spread * 0.7;
    const g2 = gaussRand(r) * spread * 0.3;
    const g3 = gaussRand(r) * spread * 0.7;
    const c = base.clone().offsetHSL((r()-0.5)*0.05, 0.1, 0.2);
    group.add(makeGalaxySprite(centerX + g1, centerY + g2, centerZ + g3, c, 0.8 + r()*0.6));
  }
  return group;
}

// 大尺度结构 3D 模型类型映射
const STRUCT_COLORS = {
  'cluster':       0x4fc3f7,
  'supercluster':  0xffc060,
  'wall':          0xff5a3c,
  'arc':           0xc080ff,
  'lqg':           0x80ff90,
  'cmb-dipole':    0xff90c0
};

// 数据索引: name → {pos, type, info}
const structIndex = new Map();

function init() {
  // ─── 1. 真实星系点云 (2MRS 18856 颗) ────────────
  {
    const N = GALAXIES.length;
    const r = rng(42);
    const positions = new Float32Array(N * 3);
    const colors = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const g = GALAXIES[i];
      const xyz = celestialToXYZ(g.ra, g.dec, g.d / 1000 * 3.2616);
      if (!xyz) continue;
      positions[i*3]   = xyz.x;
      positions[i*3+1] = xyz.y;
      positions[i*3+2] = xyz.z;
      const bright = Math.max(0.3, 1 - g.d/130);
      const c = new THREE.Color(0xaaccff).multiplyScalar(bright);
      colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.5, sizeAttenuation: true, vertexColors: true,
      transparent: true, opacity: 0.9, depthWrite: false,
      map: makeDotTexture([180,200,255]),
      alphaTest: 0.01
    });
    GROUP.add(new THREE.Points(geo, mat));
  }

  // ─── 2. 大尺度结构 3D 模型 (12 个) ────────────
  STRUCTURES.structures.forEach((s, i) => {
    const xyz = celestialToXYZ(s.ra, s.dec, s.d_gly);
    if (!xyz) return;
    const color = STRUCT_COLORS[s.type] || 0xffffff;
    let model = null;
    let labelOffset = 1.5;
    if (s.type === 'cluster') {
      // 本星系群/室女座星系团: 密集核心 + 亮星系 + 潮汐流
      const radius = s.name.includes('本星系群') ? 3 : 5;
      model = makeCluster(xyz.x, xyz.y, xyz.z, radius, i*100+7, color, 400);
    } else if (s.type === 'supercluster') {
      // 超团: 多子团 + filament 连接
      const radius = s.name.includes('拉尼亚凯亚') ? 12 : (s.name.includes('双鱼') ? 10 : 8);
      model = makeSupercluster(xyz.x, xyz.y, xyz.z, radius, i*100+11, color, s.name);
    } else if (s.type === 'wall') {
      // 长城: 多行 sheet + 亮子团 + 垂直分支
      const length = s.name.includes('史隆') ? 18 : (s.name.includes('武仙') ? 35 : 15);
      const thickness = s.name.includes('武仙') ? 2.5 : 2;
      const dir = s.ra + 90;
      model = makeWall(xyz.x, xyz.y, xyz.z, length, thickness, dir, i*100+13, color, s.name);
    } else if (s.type === 'arc') {
      // 弧: 巨弧多平行线, GRB 环用专用 360° 环
      if (s.name.includes('GRB')) {
        model = makeRing(xyz.x, xyz.y, xyz.z, 20, 1.8, i*100+17, color, 600);
      } else {
        // 巨弧: sweep 跟实际近似
        const radius = 14;
        const sweep = 120;
        const dir = s.ra;
        model = makeArc(xyz.x, xyz.y, xyz.z, radius, sweep, dir, 2.5, i*100+17, color, 500);
      }
    } else if (s.type === 'lqg') {
      // LQG: 亮类星体 + 背景点
      model = makeLQG(xyz.x, xyz.y, xyz.z, 7, i*100+19, color, 200);
    } else if (s.type === 'cmb-dipole') {
      // CMB 偶极: 在原点的小标记
      const origin = celestialToXYZ(0, 0, 0.01);
      if (origin) model = makeCluster(origin.x, origin.y, origin.z, 2, 99, color, 100);
    }
    if (model) GROUP.add(model);

    // 中心 sprite 标记
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      color, transparent: true, opacity: 0.95, depthWrite: false,
      map: makeDotTexture([(color>>16)&0xff,(color>>8)&0xff,color&0xff])
    }));
    sprite.scale.set(4, 4, 1);
    sprite.position.set(xyz.x, xyz.y, xyz.z);
    GROUP.add(sprite);

    // 标签
    const labelColor = '#' + color.toString(16).padStart(6, '0');
    // 6 个大尺度结构 (距离 0.3 Gly 以上) 用醒目大标签 + 可点击
    const isLargeScale = ['双鱼-鲸鱼 SC','史隆长城','武仙-北冕长城','巨弧 (Giant Arc)','Huge-LQG','GRB 大环'].includes(s.name);
    const labelText = isLargeScale ? '🌀 ' + s.name : (s.name + ' · ' + s.type);
    const label = makeLabel(labelText, labelColor, sprite, isLargeScale ? '14px' : '12px', true,
      () => focusOn([xyz.x, xyz.y, xyz.z])
    );
    if (isLargeScale) {
      // 大标签额外加渐变背景 + 阴影
      const el = label.element;
      Object.assign(el.style, BIG_LABEL_STYLE);
    }
    structIndex.set(s.name, { pos: [xyz.x, xyz.y, xyz.z], info: s, sprite, label });
  });

  // ─── 3. 著名星系 (11 个) ────────────
  STRUCTURES.famous_galaxies.forEach(g => {
    const xyz = celestialToXYZ(g.ra, g.dec, g.d_gly);
    if (!xyz) return;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      color: 0xfff0c0, transparent: true, opacity: 0.95, depthWrite: false,
      map: makeDotTexture([255,240,192])
    }));
    sprite.scale.set(3, 3, 1);
    sprite.position.set(xyz.x, xyz.y, xyz.z);
    GROUP.add(sprite);
    makeLabel(g.name, '#fff0c0', sprite, '11px');
  });

  // ─── 4. 银河系 (原点) ────────────
  {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      color: 0xffe080, transparent: true, opacity: 1.0, depthWrite: false,
      map: makeDotTexture([255,224,128])
    }));
    sprite.scale.set(4, 4, 1);
    sprite.position.set(0, 0, 0);
    GROUP.add(sprite);
    makeLabel('🌍 银河系 (你在这里)', '#ffe080', sprite, '13px', true);
  }

  // ─── 5. 可观测宇宙边界球壳 ────────────
  {
    const r = distToUnits(46.5);
    const geo = new THREE.SphereGeometry(r, 64, 32);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x6080a0, wireframe: true, transparent: true, opacity: 0.15,
      side: THREE.BackSide
    });
    GROUP.add(new THREE.Mesh(geo, mat));
    const labelDiv = document.createElement('div');
    Object.assign(labelDiv.style, LABEL_STYLE, {
      fontSize: '14px', fontWeight: '700',
      color: '#aaccff',
      background: 'rgba(0,0,20,0.6)',
      border: '1px solid rgba(120,180,255,0.5)',
      padding: '6px 12px'
    });
    labelDiv.textContent = '🌐 可观测宇宙边界 · 46.5 Gly · 光行距离';
    const boundaryLabel = new THREE.CSS2DObject(labelDiv);
    boundaryLabel.position.set(0, r * 1.05, 0);
    GROUP.add(boundaryLabel);
  }

  // ─── 6. 距离刻度环 ────────────
  [1, 5, 10].forEach(d => {
    const r = distToUnits(d);
    if (r < 0) return;
    const ringGeo = new THREE.BufferGeometry();
    const segs = 128;
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const a = (i / segs) * Math.PI * 2;
      pts.push(new THREE.Vector3(r * Math.cos(a), 0, r * Math.sin(a)));
    }
    ringGeo.setFromPoints(pts);
    const ringMat = new THREE.LineBasicMaterial({
      color: 0x406080, transparent: true, opacity: 0.4
    });
    GROUP.add(new THREE.Line(ringGeo, ringMat));
  });
}

// ── 交互 ──
let action = null, prevX = 0, prevY = 0;
const panTarget = new THREE.Vector3(0, 0, 0);
let rotY = 0, rotX = 0.12, viewDist = 260;
let camAnim = null;
let focused = null;
let focusDist = 30;

function smoothStep(t) { return t * t * (3 - 2 * t); }
function flyCameraTo(endPos, endLook, duration) {
  camAnim = {
    t: 0, dur: duration || 1.5,
    startPos: camera.position.clone(),
    startLook: panTarget.clone(),
    endPos: endPos.clone(),
    endLook: endLook.clone()
  };
}

function focusOn(pos) {
  const worldPos = new THREE.Vector3(...pos);
  // 距离根据 z 远近: 近的用大距离, 远的用更大距离
  const dist = worldPos.length() * 0.3 + 15;
  focusDist = dist;
  const offset = new THREE.Vector3(dist*0.5, dist*0.4, dist*0.8).normalize().multiplyScalar(dist);
  const targetPos = worldPos.clone().add(offset);
  flyCameraTo(targetPos, worldPos.clone(), 1.5);
  focused = pos;
  document.getElementById('focus-hint').textContent = `🔭 聚焦中 (右键旋转, 滚轮缩放, 点击空白返回)`;
  document.getElementById('focus-hint').style.display = 'block';
}

function backToOverview() {
  focused = null;
  document.getElementById('focus-hint').style.display = 'none';
  flyCameraTo(
    new THREE.Vector3(60, 90, 180),
    new THREE.Vector3(0, 0, 0),
    1.5
  );
}

container.addEventListener('contextmenu', e => e.preventDefault());
container.addEventListener('mousedown', e => {
  action = (e.button === 2) ? 'rotate' : 'pan';
  prevX = e.clientX; prevY = e.clientY;
  container.classList.add('dragging');
});
window.addEventListener('mouseup', () => { action = null; container.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  if (!action) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  if (action === 'rotate') {
    rotY += dx * 0.005;
    rotX = Math.max(-1.45, Math.min(1.45, rotX + dy*0.005));
  } else {
    if (focused) return;
    const s = viewDist * 0.0022;
    const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
    panTarget.addScaledVector(right, -dx*s);
    panTarget.addScaledVector(up, dy*s);
  }
  prevX = e.clientX; prevY = e.clientY;
});
container.addEventListener('wheel', e => {
  e.preventDefault();
  if (focused) {
    focusDist *= (e.deltaY > 0 ? 1.12 : 0.88);
    focusDist = Math.max(5, Math.min(300, focusDist));
  } else {
    viewDist *= (e.deltaY > 0 ? 1.1 : 0.9);
    viewDist = Math.max(30, Math.min(900, viewDist));
  }
}, { passive: false });

// Raycast: 点击 sprite 聚焦
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
container.addEventListener('click', (e) => {
  // 如果点击在 label 上 (label 自己的 click handler 处理的), 跳过
  if (labelRenderer.domElement.contains(e.target)) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const sprites = [];
  GROUP.traverse(o => { if (o.isSprite) sprites.push(o); });
  const hits = raycaster.intersectObjects(sprites, false);
  if (hits.length > 0) {
    const hit = hits[0].object;
    for (const [k, v] of structIndex) {
      if (v.sprite === hit) { focusOn(v.pos); return; }
    }
    // 银河系
    const wp = new THREE.Vector3();
    hit.getWorldPosition(wp);
    if (wp.length() < 1) { focusOn([0,0,0]); return; }
  } else if (focused) {
    backToOverview();
  }
});

function animate() {
  requestAnimationFrame(animate);
  if (camAnim) {
    camAnim.t += 1/60;
    const t = Math.min(1, camAnim.t / camAnim.dur);
    const e = smoothStep(t);
    const pos = camera.position.clone().lerpVectors(camAnim.startPos, camAnim.endPos, e);
    const look = new THREE.Vector3().lerpVectors(camAnim.startLook, camAnim.endLook, e);
    camera.position.copy(pos);
    panTarget.copy(look);
    if (t >= 1) camAnim = null;
  } else if (focused) {
    const worldPos = new THREE.Vector3(...focused);
    const offset = new THREE.Vector3(focusDist*0.4, focusDist*0.5, focusDist*0.8).normalize().multiplyScalar(focusDist);
    camera.position.copy(worldPos).add(offset);
    panTarget.copy(worldPos);
  } else {
    const dist = camera.position.distanceTo(panTarget);
    camera.position.set(
      panTarget.x + dist*Math.sin(rotY)*Math.cos(rotX),
      panTarget.y + dist*Math.sin(rotX),
      panTarget.z + dist*Math.cos(rotY)*Math.cos(rotX)
    );
  }
  camera.lookAt(panTarget);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('close-btn').onclick = () => {
  window.parent.postMessage({ type: 'close-observable-3d' }, '*');
};

// 接收主窗口结构标签点击 → 飞到该结构
window.addEventListener('message', (ev) => {
  if (ev.data && ev.data.type === 'focus-structure') {
    const name = ev.data.name;
    if (name === 'overview') { backToOverview(); return; }
    const entry = structIndex.get(name);
    if (entry) focusOn(entry.pos);
  }
  if (ev.data && ev.data.type === 'focus-galaxy') {
    // 也支持著名星系
    const name = ev.data.name;
    if (name === 'overview') { backToOverview(); return; }
    // 在 STRUCTURES.famous_galaxies 里找
    if (STRUCTURES) {
      const g = STRUCTURES.famous_galaxies.find(x => x.name.startsWith(name) || x.name.includes(name));
      if (g) {
        const xyz = celestialToXYZ(g.ra, g.dec, g.d_gly);
        if (xyz) focusOn([xyz.x, xyz.y, xyz.z]);
      }
    }
  }
});
