<script>
const container = document.getElementById('container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000006);

// 星空背景
const starField = new THREE.Points(
  new THREE.BufferGeometry(),
  new THREE.PointsMaterial({ color: 0x8899bb, size: 1.0, sizeAttenuation: false, transparent: true, opacity: 0.7 })
);
{
  const count = 2500, pos = new Float32Array(count*3);
  for (let i=0;i<count;i++){
    const r = 200 + Math.random()*300;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
  }
  starField.geometry.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(starField);
}

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 10000);
camera.position.set(0, 4, 7);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// 单位: 1 unit = 1 Mpc (本星系群 ~5 Mpc 跨)
const GROUP = new THREE.Group();
scene.add(GROUP);

// ── 银河系: 高密度粒子云 (核球 + 4条旋臂 + 散点), 真实形态 ──
const mwGroup = makeGalaxyParticles('spiral', 1.2, 12345).group;
mwGroup.rotation.x = 0.35;   // 倾斜
mwGroup.rotation.y = 0.5;
GROUP.add(mwGroup);

// ── 仙女座 M31: 紧缠旋臂粒子云 (M31 风格), 倾角 ~77° 压扁 ──
const andData = GALAXIES.find(g => g.norm === 'M31' || (g.name||'').toLowerCase()==='andromeda');
const andPos = andData ? new THREE.Vector3(andData.x, andData.y, andData.z) : new THREE.Vector3(0.3, 0.4, 0.5);
const andGroup = makeGalaxyParticles('elliptical', 1.0, 88888).group;  // M31 压扁椭圆粒子云
andGroup.position.copy(andPos);
andGroup.scale.set(1, 0.4, 1);   // 压扁, 模拟几乎平视侧看
andGroup.rotation.x = 0.25;
andGroup.rotation.y = -0.6;
GROUP.add(andGroup);

// ── 所有星系统一 3D 模型: 椭圆盘 + 核球(可选) + 暗尘埃带 + 真实/程序化贴图 ──
const clickables = [];
const SPIRAL_IRR = new Set(['LMC','SMC','TRIANGULUM','NGC598','NGC6822','IC10','NGC3109','NGC55','NGC300','IC1613','WLM','SEXTANSA','SEXTANSB','M33','NGC0055','IC1613']);
const ELLIPTICAL = new Set(['M32','NGC221','NGC205','NGC185','NGC147']);

function classify(g) {
  const norm = (g.norm||'').toUpperCase();
  const n = (g.name||'').toLowerCase();
  if (SPIRAL_IRR.has(norm) || norm==='LMC' || norm==='SMC' || n.includes('triangulum')) return 'spiral';
  if (ELLIPTICAL.has(norm) || norm==='M32' || norm==='NGC221') return 'elliptical';
  return 'dwarf';
}

// ── 星云感粒子云星系模型: 不再用贴图/平面, 全部由发光粒子按真实形态分布 ──
// 形态算法: 旋涡 = 核球密集 + 4条对数旋臂 + HII区; 椭圆 = 椭球径向衰减; 不规则 = 散点云; 暗矮 = 少量散点
function rng(seed) {
  // 简易确定噪声, 让同一种子生成相同布局 (可复现)
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0xffffffff; };
}

// 生成单个星系的粒子云, 返回 Group
function makeGalaxyParticles(cls, radius, seed) {
  const r = rng(seed);
  const group = new THREE.Group();
  const isMajor = radius > 0.3;  // 大星系用更多粒子

  let positions = [], colors = [], sizes = [], opacities = [];
  let bulgeCount = 0, armCount = 0, haloCount = 0;
  if (cls === 'spiral') {
    bulgeCount = isMajor ? 220 : 60;
    armCount = isMajor ? 1500 : 350;
    haloCount = isMajor ? 400 : 100;
  } else if (cls === 'elliptical') {
    bulgeCount = isMajor ? 250 : 70;
    armCount = 0;
    haloCount = isMajor ? 350 : 100;
  } else {  // dwarf (暗矮/不规则)
    bulgeCount = 0; armCount = 0; haloCount = isMajor ? 150 : 30;
  }

  // 1) 核球 / 中心区: 高斯分布密集粒子 (黄白)
  for (let i = 0; i < bulgeCount; i++) {
    const u = r(), v = r(), w = r();
    // 高斯(Box-Muller简化): 均匀开方根做3D高斯近似
    const gauss = Math.sqrt(-2*Math.log(Math.max(u,1e-6))) * Math.cos(2*Math.PI*v);
    const gauss2 = Math.sqrt(-2*Math.log(Math.max(w,1e-6))) * Math.cos(2*Math.PI*u);
    const rb = radius * (cls === 'elliptical' ? 0.18 : 0.15);  // 核球半径
    const x = gauss * rb * 0.5;
    const y = gauss2 * rb * 0.5 * (cls === 'elliptical' ? 0.7 : 0.4);  // 扁
    const z = gauss * rb * 0.5;
    positions.push(x, y, z);
    // 黄白暖色
    const w0 = r();
    const col = new THREE.Color(w0<0.6 ? 0xfff0c0 : (w0<0.85 ? 0xffd89a : 0xffc060));
    col.multiplyScalar(0.85 + r()*0.3);
    colors.push(col.r, col.g, col.b);
    // 核球粒子稍大、稍亮
    sizes.push(r()<0.05 ? 0.16 : (r()<0.2 ? 0.1 : 0.06));
    opacities.push(r()<0.1 ? 0.95 : 0.75);
  }

  // 2) 旋臂 (仅 spiral)
  if (cls === 'spiral' && armCount > 0) {
    const arms = 4;
    for (let i = 0; i < armCount; i++) {
      const ai = Math.floor(r() * arms);
      const t = r();   // 0~1, 沿旋臂归一化
      const rArm = (radius * 0.2) + Math.pow(t, 1.4) * radius * 1.5;  // 内紧外松
      if (rArm > radius * 2.2) continue;
      const th = t * Math.PI * 2.6 + (ai * Math.PI * 2 / arms);
      // 旋臂宽度噪声(让旋臂粗细不一, 不规则)
      const w = (r()-0.5) * radius * 0.18;
      const x = rArm * Math.cos(th) + w * Math.cos(th + Math.PI/2);
      const z = rArm * Math.sin(th) + w * Math.sin(th + Math.PI/2);
      const y = (r()-0.5) * radius * 0.05;  // 薄盘
      positions.push(x, y, z);
      // 旋臂颜色: 内蓝白(年轻恒星), 外偏黄(老恒星), 末端更黄
      const age = t;
      let col;
      if (age < 0.3) col = new THREE.Color(0xc8d8ff);
      else if (age < 0.6) col = new THREE.Color(0xeae8e0);
      else col = new THREE.Color(0xffd89a);
      col.multiplyScalar(0.5 + r()*0.5);
      colors.push(col.r, col.g, col.b);
      // 大小: 少数大亮点 + 多数小点
      sizes.push(r()<0.03 ? 0.18 : (r()<0.15 ? 0.1 : 0.04));
      opacities.push(r()<0.05 ? 0.9 : 0.55);
    }
    // HII 区(粉色): 旋臂上少数粉色点
    if (isMajor) {
      for (let i = 0; i < 50; i++) {
        const ai = Math.floor(r()*4);
        const t = 0.2 + r()*0.7;
        const rArm = (radius * 0.2) + Math.pow(t, 1.4) * radius * 1.5;
        const th = t * Math.PI * 2.6 + (ai * Math.PI * 2 / 4);
        const x = rArm * Math.cos(th), z = rArm * Math.sin(th);
        positions.push(x, (r()-0.5)*radius*0.05, z);
        const col = new THREE.Color(0xff7fae).multiplyScalar(0.7 + r()*0.3);
        colors.push(col.r, col.g, col.b);
        sizes.push(0.12);
        opacities.push(0.7);
      }
    }
  }

  // 3) 外晕 / 不规则分布 (矮星系整体作为不规则云)
  for (let i = 0; i < haloCount; i++) {
    // 不规则云: 偏离中心, 随机分布
    const u = r(), v = r(), w = r();
    const rdist = Math.pow(r(), 0.7) * radius * 2;
    const th = r() * Math.PI * 2;
    const ph = (r() - 0.5) * Math.PI;  // 球面分布
    const x = rdist * Math.sin(ph) * Math.cos(th) * (cls === 'elliptical' ? 1.2 : 1);
    const y = rdist * Math.cos(ph) * (cls === 'elliptical' ? 0.6 : 0.3);
    const z = rdist * Math.sin(ph) * Math.sin(th);
    positions.push(x, y, z);
    // 颜色: 旋涡蓝白, 椭圆黄白, 不规则/暗矮蓝灰
    let col;
    if (cls === 'elliptical') col = new THREE.Color(0xffd8a0);
    else if (cls === 'spiral') col = new THREE.Color(r()<0.7 ? 0xc8d8ff : 0xfff0e0);
    else col = new THREE.Color(0x8aa8cc);
    col.multiplyScalar(0.4 + r()*0.5);
    colors.push(col.r, col.g, col.b);
    sizes.push(r()<0.05 ? 0.14 : (r()<0.2 ? 0.08 : 0.035));
    opacities.push(r()<0.05 ? 0.85 : 0.5);
  }

  // 4) 构建 Points 对象 (单 Points 高效绘制)
  const N = positions.length / 3;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
  // 启用自定义 size attribute
  const mat = new THREE.PointsMaterial({
    size: 0.06,
    sizeAttenuation: true,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    map: (()=>{ const c=document.createElement('canvas'); c.width=c.height=32;
      const g=c.getContext('2d'); const gr=g.createRadialGradient(16,16,0,16,16,16);
      gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.4,'rgba(255,255,255,0.5)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=gr; g.fillRect(0,0,32,32); return new THREE.CanvasTexture(c); })()
  });
  const points = new THREE.Points(geo, mat);
  group.add(points);

  return { group, count: N, bulgeCount, armCount, haloCount };
}

// 大星系 (用更多粒子 + 大半径)
const MAJOR_GALAXIES = {
  'LMC': 'spiral', 'SMC': 'spiral', 'TRIANGULUM': 'spiral', 'NGC598': 'spiral',
  'M32': 'elliptical', 'NGC221': 'elliptical', 'NGC205': 'elliptical', 'NGC185': 'elliptical', 'NGC147': 'elliptical',
  'NGC300': 'spiral', 'NGC6822': 'spiral', 'IC10': 'spiral', 'NGC3109': 'spiral',
  'NGC55': 'spiral', 'IC1613': 'spiral', 'WLM': 'spiral'
};

GALAXIES.forEach((g, idx) => {
  if (g.type === 'milkyway') return;
  if (g.norm === 'M31' || g.norm === 'ANDROMEDA') return;
  const norm = (g.norm||'').toUpperCase();
  const cls = classify(g);
  const d = Math.sqrt(g.x*g.x+g.y*g.y+g.z*g.z) || 0.5;

  // 大小: 大星系固定大尺寸, 其他按距离衰减
  let radius;
  const isMajor = !!MAJOR_GALAXIES[norm];
  if (isMajor) {
    // 大星系 (LMC, M33 等): 给足够大的粒子云半径
    radius = 0.4 - Math.min(d, 1.5) * 0.1;
    radius = Math.max(0.25, radius);
  } else if (cls === 'spiral') {
    radius = Math.max(0.10, 0.22 - d*0.04);
  } else if (cls === 'elliptical') {
    radius = Math.max(0.08, 0.16 - d*0.03);
  } else {
    radius = 0.05 + Math.max(0, 0.06 - d*0.015);
  }

  // 用粒子云生成星系
  const { group } = makeGalaxyParticles(cls, radius, idx * 31 + 7);
  // 倾斜 (同一种子保证确定性, 但 makeGalaxyParticles 内部已用它)
  const rand = rng(idx * 31 + 7);
  const tiltX = (cls === 'elliptical' ? 0 : (rand() * 0.5 - 0.15));
  const tiltY = rand() * Math.PI;
  const yScale = (cls === 'elliptical' ? 0.85 + rand()*0.15 : (cls === 'spiral' ? 0.6 + rand()*0.3 : 1));
  group.scale.set(1, yScale, 1);
  group.rotation.x = tiltX;
  group.rotation.y = tiltY;
  group.position.set(g.x, g.y, g.z);
  GROUP.add(group);

  clickables.push({ mesh: group, info: {
    name: g.name, sub: cls === 'spiral' ? '旋涡/不规则星系' : (cls === 'elliptical' ? '椭圆星系' : '矮星系'),
    rows: [`距银河系 ${d.toFixed(2)} Mpc`,
           `赤经 RA ${g.ra?.toFixed(2) ?? '—'}° · 赤纬 Dec ${g.dec?.toFixed(2) ?? '—'}°`,
           isMajor ? '✓ 大星系(粒子云)' : '粒子云']
  }});
});

// 银河系自身也可点击(贴图本身已亮, 不加外光晕)
clickables.push({ mesh: mwGroup, info: { name: '银河系 Milky Way', sub: '我们的家园星系', rows: ['直径约 10 万光年','含太阳系与 2000 亿+ 恒星'] } });

// ── 交互: 左键平移 / 右键旋转 / 滚轮缩放 ──
let action = null, prevX = 0, prevY = 0;
const panTarget = new THREE.Vector3(0,0,0);
let rotY = 0.9, rotX = 0.5, viewDist = 8;

container.addEventListener('contextmenu', e => e.preventDefault());
container.addEventListener('mousedown', e => {
  action = (e.button === 2) ? 'rotate' : 'pan';
  prevX = e.clientX; prevY = e.clientY;
  container.classList.add('dragging');
});
window.addEventListener('mouseup', () => { action = null; container.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  if (!action) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  if (action === 'rotate') {
    rotY += dx * 0.005;
    rotX = Math.max(-1.45, Math.min(1.45, rotX + dy*0.005));
  } else {
    const s = viewDist * 0.0015;
    const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
    panTarget.addScaledVector(right, -dx*s);
    panTarget.addScaledVector(up, dy*s);
  }
  prevX = e.clientX; prevY = e.clientY;
});
container.addEventListener('wheel', e => {
  e.preventDefault();
  viewDist *= (e.deltaY > 0 ? 1.1 : 0.9);
  viewDist = Math.max(2, Math.min(60, viewDist));
}, { passive: false });

// 拾取
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
container.addEventListener('click', e => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left)/rect.width)*2 - 1;
  mouse.y = -((e.clientY - rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickables.map(c=>c.mesh), true);
  if (hits.length > 0) {
    const obj = hits[0].object;
    const entry = clickables.find(c => c.mesh === obj || (c.mesh.children||[]).includes(obj));
    if (entry) showInfo(entry.info);
  }
});
function showInfo(info) {
  tooltip.style.display = 'block';
  tooltip.style.left = '50%'; tooltip.style.top = '55%'; tooltip.style.transform = 'translateX(-50%)';
  tooltip.innerHTML = `<b style="font-size:15px;">${info.name}</b> · ${info.sub}<br>
    <span style="color:#aac;font-size:12px;line-height:1.5;">${info.rows.join('<br>')}</span>`;
  setTimeout(()=> tooltip.style.display = 'none', 5000);
}

// ── 动画 ──
function animate() {
  requestAnimationFrame(animate);
  camera.position.set(
    panTarget.x + viewDist*Math.sin(rotY)*Math.cos(rotX),
    panTarget.y + viewDist*Math.sin(rotX),
    panTarget.z + viewDist*Math.cos(rotY)*Math.cos(rotX)
  );
  camera.lookAt(panTarget);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('close-btn').onclick = () => {
  window.parent.postMessage({ type: 'close-localgroup-3d' }, '*');
};
</script>
