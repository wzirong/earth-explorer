<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>本星系群 · 3D</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #container { position: fixed; inset: 0; cursor: grab; }
  #container.dragging { cursor: grabbing; }
  #info { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
          color: rgba(255,255,255,0.85); font: 600 16px sans-serif; letter-spacing: 2px;
          text-shadow: 0 2px 10px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; white-space: nowrap; }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
          color: rgba(255,255,255,0.45); font: 12px sans-serif; pointer-events: none; z-index: 10; white-space: nowrap; }
  #tooltip { position: fixed; background: rgba(20,22,28,0.95); color: #fff; padding: 10px 14px;
             border-radius: 8px; font-size: 13px; pointer-events: none; display: none; z-index: 100;
             border: 1px solid rgba(255,255,255,0.15); max-width: 320px; line-height: 1.5; }
  #focus-hint { position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
                color: #fff; font: 600 13px sans-serif; text-shadow: 0 2px 8px rgba(0,0,0,0.9);
                display: none; z-index: 30; background: rgba(20,22,28,0.8);
                padding: 5px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); }
  #close-btn { position: fixed; top: 14px; right: 16px; padding: 8px 16px;
               background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
               border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer; z-index: 20; font-weight: 600; }
  #close-btn:hover { background: rgba(255,255,255,0.2); }
  #scale-tip { position: fixed; top: 50px; left: 14px; color: rgba(255,220,150,0.85);
               font: 11px sans-serif; z-index: 10; background: rgba(20,22,28,0.65);
               padding: 6px 10px; border-radius: 6px; pointer-events: none;
               border: 1px solid rgba(255,220,150,0.25); line-height: 1.7; max-width: 240px; }
  #legend { position: fixed; bottom: 60px; left: 14px; color: rgba(255,255,255,0.55);
            font: 11px sans-serif; pointer-events: none; z-index: 10; line-height: 1.6; }
  #legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<div id="container"></div>
<div id="info">🌃 本星系群 · 3D (103 颗真实星系 · 银河系群/仙女座群/场星系)</div>
<div id="hint">🖱 左键平移 · 右键旋转(看3D透视) · 滚轮缩放 · 点击星系聚焦</div>
<div id="scale-tip">
  <b>尺度:</b> 1 单位 = 1 Mpc<br>
  · 银河系群: 半径 ~0.3 Mpc<br>
  · 仙女座群: 半径 ~0.5 Mpc, 距银心 ~0.78 Mpc<br>
  · 场星系: 散布 0.4~3.0 Mpc
</div>
<div id="legend">
  <div><span class="swatch" style="background:#5588cc"></span>银河系群 (28 颗, 蓝)</div>
  <div><span class="swatch" style="background:#cc7755"></span>仙女座群 (35 颗, 橙)</div>
  <div><span class="swatch" style="background:#888"></span>场星系 (40 颗, 灰)</div>
</div>
<div id="tooltip"></div>
<div id="focus-hint"></div>
<button id="close-btn">← 返回地球</button>

<script src="three.min.js"></script>
<script src="CSS2DRenderer.js"></script>
<script>
let DATA = null;
fetch('data/local_group_3d.json').then(r=>r.json()).then(d => { DATA = d; init(); });

const container = document.getElementById('container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000006);

// 星空背景
const starField = new THREE.Points(
  new THREE.BufferGeometry(),
  new THREE.PointsMaterial({ color: 0x8899bb, size: 1.0, sizeAttenuation: false, transparent: true, opacity: 0.5 })
);
{
  const count = 2500, pos = new Float32Array(count*3);
  for (let i=0;i<count;i++){
    const r = 300 + Math.random()*400;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
  }
  starField.geometry.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(starField);
}

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 10000);
camera.position.set(2.5, 2.0, 4.0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.inset = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const GROUP = new THREE.Group();
scene.add(GROUP);

// ── 标签样式 ──
function makeLabel(text, color, target, fontSize='13px', bold=false) {
  const el = document.createElement('div');
  el.textContent = text;
  el.style.fontSize = fontSize;
  el.style.color = color;
  el.style.background = 'rgba(15,20,30,0.75)';
  el.style.padding = '3px 10px';
  el.style.borderRadius = '12px';
  el.style.border = `1px solid ${color}80`;
  el.style.whiteSpace = 'nowrap';
  el.style.fontFamily = 'sans-serif';
  el.style.letterSpacing = '0.5px';
  el.style.userSelect = 'none';
  el.style.pointerEvents = 'auto';
  el.style.textShadow = '0 1px 4px rgba(0,0,0,0.9)';
  if (bold) el.style.fontWeight = '700';
  const label = new THREE.CSS2DObject(el);
  label.position.set(0, 1.0, 0);
  target.add(label);
  return label;
}

// ── 圆点贴图 (高分辨率发光小圆) ──
function makeDotTexture(rgb, alpha=1) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32,32,0,32,32,32);
  const [r,b,bb] = rgb;
  gr.addColorStop(0, `rgba(${r},${b},${bb},${alpha})`);
  gr.addColorStop(0.25, `rgba(${r},${b},${bb},${alpha*0.8})`);
  gr.addColorStop(0.6, `rgba(${r},${b},${bb},${alpha*0.3})`);
  gr.addColorStop(1, `rgba(${r},${b},${bb},0)`);
  g.fillStyle = gr;
  g.fillRect(0,0,64,64);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}

// ── 随机数 / 高斯分布 ──
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 0xffffffff; };
}
function gaussRand(r) {
  let u1 = r(), u2 = r();
  while (u1 < 1e-6) u1 = r();
  return Math.sqrt(-2*Math.log(u1)) * Math.cos(2*Math.PI*u2);
}

// ── 子群粒子云 (细腻真实风格: 子群中心点云扩散) ──
function makeGroupCloud(centerX, centerY, centerZ, radius, seed, colorWarm) {
  const r = rng(seed);
  const N = 500;  // 匹配拉尼亚凯亚 500 颗/分支
  const positions = new Float32Array(N * 3);
  const colors = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const g1 = gaussRand(r), g2 = gaussRand(r), g3 = gaussRand(r);
    positions[i*3]   = centerX + g1 * radius;
    positions[i*3+1] = centerY + g2 * radius * 0.7;
    positions[i*3+2] = centerZ + g3 * radius;
    // 颜色: 暖(银心/M31) 用黄白, 冷(场星系) 用蓝白
    const c = new THREE.Color(colorWarm ? (r()<0.5 ? 0xffe8c0 : 0xffd89a) : (r()<0.5 ? 0xc8d8ff : 0xa0b8e0))
      .multiplyScalar(0.5 + r()*0.4);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.06, sizeAttenuation: true, vertexColors: true,
    transparent: true, opacity: 0.75, depthWrite: false,
    map: makeDotTexture([255,255,255]),
    alphaTest: 0.01
  });
  return new THREE.Points(geo, mat);
}

// ── 数据索引: 用于聚焦 ──
const galaxyIndex = new Map();
let focusedGalaxy = null;
let focusDist = 4.0;
let camAnim = null;
let panTarget = new THREE.Vector3(0, 0, 0);

function smoothStep(t) { return t * t * (3 - 2 * t); }

function flyCameraTo(endPos, endLook, duration) {
  camAnim = {
    t: 0, dur: duration || 1.4,
    startPos: camera.position.clone(),
    startLook: panTarget.clone(),
    endPos: endPos.clone(),
    endLook: endLook.clone()
  };
}

function focusOn(entry) {
  focusedGalaxy = entry;
  const worldPos = new THREE.Vector3(...entry.pos);
  // 聚焦距离根据子群密度
  const subgroup = entry.info.subgroup;
  const dist = subgroup === 'mw' ? 0.6 : (subgroup === 'm31' ? 0.8 : 1.0);
  focusDist = dist;
  const offset = new THREE.Vector3(dist*0.6, dist*0.5, dist*1.2).normalize().multiplyScalar(dist * 2.0);
  const targetPos = worldPos.clone().add(offset);
  flyCameraTo(targetPos, worldPos.clone(), 1.4);
  showInfo(entry.info);
  document.getElementById('focus-hint').textContent = `🔭 正在观察: ${entry.info.name} (右键旋转, 滚轮缩放, 点击空白返回)`;
  document.getElementById('focus-hint').style.display = 'block';
}

function backToOverview() {
  focusedGalaxy = null;
  document.getElementById('focus-hint').style.display = 'none';
  flyCameraTo(
    new THREE.Vector3(2.5, 2.0, 4.0),
    new THREE.Vector3(0, 0, 0),
    1.4
  );
}

function showInfo(info) {
  const tip = document.getElementById('tooltip');
  const distMly = (info.d * 3.2616).toFixed(2);
  const subName = {mw: '银河系群', m31: '仙女座群', field: '场星系'}[info.subgroup] || '未知';
  tip.innerHTML = `
    <div style="font-weight:600;color:#4fc3f7;font-size:14px;">${info.name}</div>
    <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px;">${subName} · ${distMly} Mly</div>
    <div style="margin-top:6px;font-size:11px;line-height:1.5;">
      RA ${info.ra?.toFixed(2)}° / Dec ${info.dec?.toFixed(2)}°<br>
      类型: ${info.type}${info.texture ? ' · 有真实影像' : ''}
    </div>
  `;
}

function init() {
  // ─── 1. 全部 103 颗星系: 单点集 (细腻真实风格) ────────────
  const N = DATA.length;
  const positions = new Float32Array(N * 3);
  const colors = new Float32Array(N * 3);
  const SUB_COLOR = {
    'mw':    new THREE.Color(0x5588cc),  // 银河系群: 冷蓝
    'm31':   new THREE.Color(0xcc7755),  // 仙女座群: 暖橙
    'field': new THREE.Color(0x888888)   // 场星系: 中灰
  };
  DATA.forEach((g, i) => {
    positions[i*3]   = g.x;
    positions[i*3+1] = g.y;
    positions[i*3+2] = g.z;
    const base = SUB_COLOR[g.subgroup] || new THREE.Color(0xffffff);
    // 距离衰减: 近的亮, 远的暗
    const bright = Math.max(0.35, 1 - g.d/3.0);
    const c = base.clone().multiplyScalar(bright);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.4, sizeAttenuation: true, vertexColors: true,
    transparent: true, opacity: 0.95, depthWrite: false,
    map: makeDotTexture([255,255,255]),
    alphaTest: 0.01
  });
  GROUP.add(new THREE.Points(geo, mat));

  // ─── 2. 三个子群的粒子云 (密集恒星云效果) ────────────
  // 银河系群中心
  const mw = makeGroupCloud(0, 0, 0, 0.18, 42, true);
  GROUP.add(mw);
  // 仙女座群中心
  const m31 = makeGroupCloud(0.78, 0, 0, 0.3, 137, true);
  GROUP.add(m31);

  // ─── 3. 主要星系: sprite + label (亮起) ────────────
  const MAJOR = new Set(['银河系 Milky Way','Andromeda','Triangulum','LMC','SMC','M32','NGC 205','NGC 147','NGC 185']);
  // ─── 3. 主要星系: 3D 盘状平面 + 程序化漩涡纹理 + 倾角旋转 ────────────
  // Sprite 永远正面朝相机 -> 看不到倾斜。改用 PlaneGeometry。
  // 纹理映射: 星系名 → 高清程序化漩涡纹理
  const TEX_MAP = {
    '银河系 Milky Way': 'data/galaxy_tex/milkyway.png',
    'Andromeda':         'data/galaxy_tex/andromeda.png',
    'Triangulum':        'data/galaxy_tex/m33.png',
    'LMC':               'data/galaxy_tex/lmc.png',
    'SMC':               'data/galaxy_tex/smc.png',
    'M32':               'data/galaxy_tex/m32.png',
    'NGC 205':           'data/galaxy_tex/ngc205.png',
    'NGC 185':           'data/galaxy_tex/ngc185.png',
    'NGC 147':           'data/galaxy_tex/ngc147.png',
    'NGC 300':           'data/galaxy_tex/ngc300.png',
  };
  const diskTexCache = {};
  function getDiskTex(path) {
    if (diskTexCache[path]) return diskTexCache[path];
    const tex = new THREE.TextureLoader().load(path);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.colorSpace = THREE.SRGBColorSpace;
    diskTexCache[path] = tex;
    return tex;
  }

  DATA.forEach((g, i) => {
    const isMajor = MAJOR.has(g.name);
    const isBrightField = g.name === 'NGC 300';  // 较亮的场星系也标记
    if (!isMajor && !isBrightField) return;
    const isMW = g.name === '银河系 Milky Way';
    const isM31 = g.name === 'Andromeda';
    const isM33 = g.name === 'Triangulum';
    const isMagellanic = g.name === 'LMC' || g.name === 'SMC';
    const isDwarf = g.name.startsWith('M32') || g.name.startsWith('NGC');
    let color = 0xfff0c0;
    let baseSize = 1.2;  // 盘状宽度 (单位 Mpc, 远大于真实尺寸仅为可见性)
    if (isMW) { color = 0xffe080; baseSize = 1.2; }
    else if (isM31) { color = 0xff9a5a; baseSize = 1.6; }
    else if (isM33) { color = 0xa0d0ff; baseSize = 1.0; }
    else if (isMagellanic) { color = 0x90c0ff; baseSize = 0.6; }
    else if (isDwarf) { color = 0xc0c0d0; baseSize = 0.25; }
    else if (isBrightField) { color = 0xffe8b0; baseSize = 0.7; }

    // 圆盘 (PlaneGeometry + 程序化漩涡纹理)
    const texPath = TEX_MAP[g.name];
    if (texPath) {
      const diskGeo = new THREE.PlaneGeometry(baseSize, baseSize);
      const tex = getDiskTex(texPath);
      const diskMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        opacity: 0.95,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const disk = new THREE.Mesh(diskGeo, diskMat);
      // 倾角: 0=face-on (盘平), 90=edge-on (盘立)
      const incl = (g.inclination || 0) * Math.PI / 180;
      // 用 Euler YXZ: Y 轴随机旋转 (按星系位置) + X 轴倾角
      const seedAngle = (g.x * 31.7 + g.z * 17.3) % (Math.PI * 2);
      disk.rotation.order = 'YXZ';
      disk.rotation.y = seedAngle;          // 绕 Y 轴任意旋转 (旋臂方向)
      disk.rotation.x = Math.PI / 2 * (1 - incl / (Math.PI/2));  // X 轴倾角
      disk.position.set(g.x, g.y, g.z);
      GROUP.add(disk);
    }

    // 中心亮点 (叠加在盘中央, 不遮挡但提示中心)
    const coreSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      color: 0xffffff, transparent: true, opacity: 0.85, depthWrite: false,
      map: makeDotTexture([255,255,255])
    }));
    coreSprite.scale.set(baseSize * 0.3, baseSize * 0.3, 1);
    coreSprite.position.set(g.x, g.y, g.z);
    GROUP.add(coreSprite);

    // 标签
    const labelColor = '#' + color.toString(16).padStart(6, '0');
    const dummy = new THREE.Object3D();
    dummy.position.set(g.x, g.y + baseSize * 0.4, g.z);
    GROUP.add(dummy);
    const label = makeLabel(g.name, labelColor, dummy, '11px', isMW || isM31);
    galaxyIndex.set(g.name.toLowerCase(), { pos: [g.x, g.y, g.z], info: g, sprite: coreSprite });
    galaxyIndex.set(g.norm?.toLowerCase() || '', { pos: [g.x, g.y, g.z], info: g, sprite: coreSprite });
  });

  // ─── 4. 子群标签 (在云团附近) ────────────
  [
    { name: '银河系群 (MW Group)', x: 0, y: 0.4, z: 0, color: '#5588cc' },
    { name: '仙女座群 (M31 Group)', x: 0.78, y: 0.55, z: 0, color: '#cc7755' }
  ].forEach(s => {
    const dummy = new THREE.Object3D();
    dummy.position.set(s.x, s.y, s.z);
    GROUP.add(dummy);
    makeLabel(s.name, s.color, dummy, '12px');
  });

  // ─── 5. 距离刻度参考 (四根短短的虚线 + 距离标签) ────────────
  // 只显示 4 根点云,代表 0.5/1.0/2.0 Mpc 半径,明显是刻度不是轨道
  [0.5, 1.0, 2.0].forEach(d => {
    // 4 根小点, 间距 d/16, 位于 +X 方向一条线
    const tickGroup = new THREE.Group();
    const tickMat = new THREE.PointsMaterial({
      color: 0x6090b0, size: 0.025, sizeAttenuation: true,
      transparent: true, opacity: 0.6
    });
    const N = 8;
    const positions = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const r = d;
      // 只画 4 个短点: 上下左右各一个 (示意半径)
      const a = (i / N) * Math.PI * 2;
      positions[i*3]   = r * Math.cos(a);
      positions[i*3+1] = 0;
      positions[i*3+2] = r * Math.sin(a);
    }
    const tickGeo = new THREE.BufferGeometry();
    tickGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    tickGroup.add(new THREE.Points(tickGeo, tickMat));
    GROUP.add(tickGroup);
    // 距离标签: 黄色小标签标在该点旁
    const labelDiv = document.createElement('div');
    labelDiv.textContent = d + ' Mpc';
    labelDiv.style.cssText = 'font-size:10px;color:#aaccdd;background:rgba(15,20,30,0.7);padding:2px 6px;border-radius:8px;border:1px solid rgba(120,180,220,0.4);font-family:sans-serif;';
    const tickLabel = new THREE.CSS2DObject(labelDiv);
    tickLabel.position.set(d + 0.05, 0, 0);
    tickGroup.add(tickLabel);
  });
}

// ── 交互 ──
let action = null, prevX = 0, prevY = 0;
let rotY = 0.4, rotX = 0.35, viewDist = 5.5;

container.addEventListener('contextmenu', e => e.preventDefault());
container.addEventListener('mousedown', e => {
  action = (e.button === 2) ? 'rotate' : 'pan';
  prevX = e.clientX; prevY = e.clientY;
  container.classList.add('dragging');
});
window.addEventListener('mouseup', () => { action = null; container.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  if (!action) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  if (action === 'rotate') {
    rotY += dx * 0.005;
    rotX = Math.max(-1.45, Math.min(1.45, rotX + dy*0.005));
  } else {
    if (focusedGalaxy) return;  // 聚焦时不允许平移
    const s = viewDist * 0.0015;
    const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
    panTarget.addScaledVector(right, -dx*s);
    panTarget.addScaledVector(up, dy*s);
  }
  prevX = e.clientX; prevY = e.clientY;
});
container.addEventListener('wheel', e => {
  e.preventDefault();
  if (focusedGalaxy) {
    focusDist *= (e.deltaY > 0 ? 1.12 : 0.88);
    focusDist = Math.max(0.3, Math.min(8, focusDist));
  } else {
    viewDist *= (e.deltaY > 0 ? 1.1 : 0.9);
    viewDist = Math.max(2, Math.min(20, viewDist));
  }
}, { passive: false });

function animate() {
  requestAnimationFrame(animate);
  // 摄像机动画过渡
  if (camAnim) {
    camAnim.t += 1/60;
    const t = Math.min(1, camAnim.t / camAnim.dur);
    const e = smoothStep(t);
    const pos = camera.position.clone().lerpVectors(camAnim.startPos, camAnim.endPos, e);
    const look = new THREE.Vector3().lerpVectors(camAnim.startLook, camAnim.endLook, e);
    camera.position.copy(pos);
    panTarget.copy(look);
    if (t >= 1) camAnim = null;
  } else if (focusedGalaxy) {
    // 聚焦态: 锁定到该星系, 跟着鼠标旋转
    const worldPos = new THREE.Vector3(...focusedGalaxy.pos);
    const offset = new THREE.Vector3(focusDist*0.4, focusDist*0.5, focusDist*1.0).normalize().multiplyScalar(focusDist);
    camera.position.copy(worldPos).add(offset);
    panTarget.copy(worldPos);
  } else {
    // 自由视角
    const dist = camera.position.distanceTo(panTarget);
    camera.position.set(
      panTarget.x + dist*Math.sin(rotY)*Math.cos(rotX),
      panTarget.y + dist*Math.sin(rotX),
      panTarget.z + dist*Math.cos(rotY)*Math.cos(rotX)
    );
  }
  camera.lookAt(panTarget);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('close-btn').onclick = () => {
  window.parent.postMessage({ type: 'close-localgroup-3d' }, '*');
};

// ── Raycast: 点击星系聚焦 ──
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
container.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  // 命中 sprite
  const sprites = [];
  GROUP.traverse(o => { if (o.isSprite) sprites.push(o); });
  const hits = raycaster.intersectObjects(sprites, false);
  if (hits.length > 0) {
    const hit = hits[0].object;
    // 找到对应星系
    for (const [k, v] of galaxyIndex) {
      if (v.sprite === hit) {
        focusOn(v);
        return;
      }
    }
  } else if (focusedGalaxy) {
    // 点击空白返回总览
    backToOverview();
  }
});

// 鼠标悬停 tooltip
container.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const sprites = [];
  GROUP.traverse(o => { if (o.isSprite) sprites.push(o); });
  const hits = raycaster.intersectObjects(sprites, false);
  const tip = document.getElementById('tooltip');
  if (hits.length > 0) {
    const hit = hits[0].object;
    for (const [k, v] of galaxyIndex) {
      if (v.sprite === hit) {
        const info = v.info;
        const distMly = (info.d * 3.2616).toFixed(2);
        const subName = {mw:'银河系群', m31:'仙女座群', field:'场星系'}[info.subgroup] || '';
        tip.innerHTML = `<div style="font-weight:600;color:#4fc3f7;">${info.name}</div><div style="font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px;">${subName} · ${distMly} Mly</div>`;
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 12) + 'px';
        tip.style.top = (e.clientY + 12) + 'px';
        container.style.cursor = 'pointer';
        return;
      }
    }
  }
  tip.style.display = 'none';
  container.style.cursor = '';
});

// 接收外部聚焦指令 (从主窗口底部导航)
window.addEventListener('message', (ev) => {
  if (ev.data && ev.data.type === 'focus-galaxy') {
    const name = (ev.data.name || '').toLowerCase();
    if (name === 'overview') {
      backToOverview();
      return;
    }
    // 多重匹配尝试
    let entry = galaxyIndex.get(name);
    if (!entry) {
      // 模糊匹配
      for (const [k, v] of galaxyIndex) {
        if (k && k.includes(name)) { entry = v; break; }
      }
    }
    if (!entry) {
      for (const [k, v] of galaxyIndex) {
        if (name && v.info.name.toLowerCase().includes(name)) { entry = v; break; }
      }
    }
    if (entry) focusOn(entry);
  }
});

// URL 参数 ?focus=Andromeda 直接聚焦
{
  const params = new URLSearchParams(window.location.search);
  const focusName = params.get('focus');
  if (focusName) {
    setTimeout(() => {
      let entry = galaxyIndex.get(focusName.toLowerCase());
      if (!entry) {
        for (const [k, v] of galaxyIndex) {
          if (k && k.includes(focusName.toLowerCase())) { entry = v; break; }
        }
      }
      if (entry) focusOn(entry);
    }, 1500);
  }
}
</script>
