<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Explorer - 地球探索器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    #navbar { background: rgba(15,15,35,0.95); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; display: flex; align-items: center; gap: 16px; z-index: 100; flex-shrink: 0; }
    #navbar h1 { font-size: 18px; font-weight: 600; color: #4fc3f7; white-space: nowrap; }
    #search-wrap { flex: 1; max-width: 400px; position: relative; }
    #search-input { width: 100%; padding: 8px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    #search-input:focus { border-color: #4fc3f7; }
    #search-input::placeholder { color: rgba(255,255,255,0.4); }
    #city-count { font-size: 12px; color: rgba(255,255,255,0.5); white-space: nowrap; }
    #main { flex: 1; display: flex; position: relative; overflow: hidden; }
    #canvas-container { flex: 1; position: relative; }
    #canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }
    #continent-nav { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: rgba(15,15,35,0.9); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); z-index: 10; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
    .cont-btn { padding: 6px 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #e0e0e0; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .cont-btn:hover { background: rgba(79,195,247,0.2); border-color: #4fc3f7; color: #4fc3f7; }
    .cont-btn.active { background: rgba(79,195,247,0.3); border-color: #4fc3f7; color: #4fc3f7; }
    #city-panel { width: 320px; background: rgba(15,15,35,0.97); border-left: 1px solid rgba(255,255,255,0.1); overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; z-index: 50; flex-shrink: 0; position: relative; }
    #city-panel.open { transform: translateX(0); }
    #panel-close { position: sticky; top: 12px; float: right; margin: 12px 12px 0 0; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px; line-height: 28px; text-align: center; z-index: 5; }
    #panel-close:hover { background: rgba(255,255,255,0.2); }
    .panel-header { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); clear: both; }
    .panel-city-name { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .panel-country { font-size: 14px; color: rgba(255,255,255,0.6); }
    .panel-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-top: 8px; font-weight: 600; }
    .badge-cn { background: rgba(244,67,54,0.3); color: #ff6b6b; border: 1px solid rgba(244,67,54,0.5); }
    .badge-global { background: rgba(33,150,243,0.3); color: #64b5f6; border: 1px solid rgba(33,150,243,0.5); }
    .panel-section { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .panel-section-title { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-item { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; }
    .stat-label { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 3px; }
    .stat-value { font-size: 15px; font-weight: 600; color: #4fc3f7; }
    .stat-item.full { grid-column: 1/-1; }
    .panel-desc { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.75); }
    .panel-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: rgba(79,195,247,0.15); border: 1px solid rgba(79,195,247,0.3); border-radius: 7px; color: #4fc3f7; font-size: 13px; text-decoration: none; margin-right: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
    .panel-link:hover { background: rgba(79,195,247,0.25); border-color: #4fc3f7; }
    #loading { position: fixed; inset: 0; background: #0a0a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; transition: opacity 0.5s; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loader { width: 50px; height: 50px; border: 3px solid rgba(79,195,247,0.2); border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 16px; color: rgba(255,255,255,0.6); font-size: 14px; }
    #tooltip { position: absolute; background: rgba(15,15,35,0.95); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 8px 12px; color: #fff; font-size: 13px; pointer-events: none; transform: translate(-50%,-100%); margin-top: -10px; white-space: nowrap; z-index: 20; display: none; }
    #tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: rgba(15,15,35,0.95); }
    #suggestions { position: absolute; top: 100%; left: 0; right: 0; background: rgba(20,20,50,0.98); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; margin-top: 4px; max-height: 300px; overflow-y: auto; z-index: 200; display: none; }
    #suggestions.show { display: block; }
    .sug-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
    .sug-item:hover { background: rgba(79,195,247,0.1); }
    .sug-name { font-size: 14px; color: #fff; }
    .sug-country { font-size: 12px; color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
<div id="loading"><div class="loader"></div><div class="loading-text">正在加载地球...</div></div>
<div id="navbar">
  <h1>🌍 Earth Explorer</h1>
  <div id="search-wrap">
    <input type="text" id="search-input" placeholder="搜索城市... (Search cities...)" autocomplete="off">
    <div id="suggestions"></div>
  </div>
  <div id="city-count">-- 个城市</div>
</div>
<div id="main">
  <div id="canvas-container"><div id="tooltip"></div></div>
  <div id="continent-nav">
    <button class="cont-btn active" data-continent="全部">🌍 全部</button>
    <button class="cont-btn" data-continent="亚洲">🌏 亚洲</button>
    <button class="cont-btn" data-continent="欧洲">🏰 欧洲</button>
    <button class="cont-btn" data-continent="北美洲">🌎 北美</button>
    <button class="cont-btn" data-continent="南美洲">🌎 南美</button>
    <button class="cont-btn" data-continent="非洲">🌍 非洲</button>
    <button class="cont-btn" data-continent="大洋洲">🏝️ 大洋洲</button>
    <button class="cont-btn" data-continent="中国">🇨🇳 中国</button>
  </div>
  <div id="city-panel">
    <button id="panel-close">✕</button>
    <div id="panel-content"></div>
  </div>
</div>
<!-- Three.js 本地加载（不走 CDN，离线可用） -->
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="renderer.js"></script>
</body>
</html>
