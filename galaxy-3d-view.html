<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>银河系 3D</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #container { position: fixed; inset: 0; cursor: grab; }
  #container.dragging { cursor: grabbing; }
  #info { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
          color: rgba(255,255,255,0.85); font: 600 16px sans-serif; letter-spacing: 2px;
          text-shadow: 0 2px 10px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; white-space: nowrap; }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
          color: rgba(255,255,255,0.45); font: 12px sans-serif; pointer-events: none; z-index: 10; white-space: nowrap; }
  #tooltip { position: fixed; background: rgba(20,22,28,0.95); color: #fff; padding: 10px 14px;
             border-radius: 8px; font-size: 13px; pointer-events: none; display: none; z-index: 100;
             border: 1px solid rgba(255,255,255,0.15); max-width: 280px; line-height: 1.5; }
  #close-btn { position: fixed; top: 14px; right: 16px; padding: 8px 16px;
               background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
               border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer; z-index: 20; font-weight: 600; }
  #close-btn:hover { background: rgba(255,255,255,0.2); }
  #focus-hint { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); color: #fff;
                font: 600 14px sans-serif; text-shadow: 0 2px 8px rgba(0,0,0,0.9); display: none; z-index: 30;
                background: rgba(20,22,28,0.8); padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); }
  #speed-ctrl { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex;
                align-items: center; gap: 6px; background: rgba(20,22,28,0.85); border: 1px solid rgba(255,255,255,0.15);
                border-radius: 10px; padding: 6px 10px; z-index: 30; }
  #speed-ctrl span { color: rgba(255,255,255,0.6); font-size: 12px; margin-right: 4px; }
  .spd { padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
         background: transparent; color: #aaa; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .spd.active { border-color: #4fc3f7; background: rgba(79,195,247,0.2); color: #4fc3f7; }
</style>
</head>
<body>
<div id="container"></div>
<div id="info">🌌 银河系 · 3D</div>
<div id="hint">🖱 左键拖动: 平移 · 右键拖动: 旋转 · 滚轮: 缩放</div>
<div id="focus-hint"></div>
<div id="speed-ctrl">
  <span>⏱ 时间流速</span>
  <button class="spd active" data-s="0">实时</button>
  <button class="spd" data-s="1e6">1秒=100万年</button>
  <button class="spd" data-s="5e7">1秒=5000万年</button>
  <button class="spd" data-s="2.25e8">1秒=1银河年</button>
</div>
<div id="tooltip"></div>
<button id="close-btn">← 返回地球</button>

<script src="three.min.js"></script>
<script>
// ── 银河系 3D (真实 ESO 俯视图盘面 + 立体核球/银晕 + 星空) ──
const container = document.getElementById('container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000008);

// 星空背景 (球形分布)
const starField = new THREE.Points(
  new THREE.BufferGeometry(),
  new THREE.PointsMaterial({ color: 0x8899bb, size: 1.1, sizeAttenuation: false, transparent: true, opacity: 0.8 })
);
{
  const count = 3000;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 400 + Math.random() * 500;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
    pos[i*3+2] = r * Math.cos(ph);
  }
  starField.geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(starField);
}

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 20000);
const camPos = new THREE.Vector3(0, 85, 140);
camera.position.copy(camPos);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// ── 单位: 1 unit = 1000 光年 ──
const GALAXY_R = 50;  // 盘半径 5 万光年
const galaxyGroup = new THREE.Group();   // 原点 = 银心
scene.add(galaxyGroup);
// 调整初始朝向: 让盘面看到美丽角度
galaxyGroup.rotation.x = 0.42;
galaxyGroup.rotation.y = 0.8;

function rand(a, b) { return a + Math.random() * (b - a); }

// ── 1. 盘面贴图 (真实 ESO 俯视图, 黑底已转透明) ──
const diskTex = new THREE.TextureLoader().load('data/galaxy_disk.png');
diskTex.anisotropy = 16;
diskTex.colorSpace = THREE.SRGBColorSpace;
const diskPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(GALAXY_R * 2, GALAXY_R * 2),
  new THREE.MeshBasicMaterial({
    map: diskTex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide
  })
);
diskPlane.rotation.x = -Math.PI / 2;
galaxyGroup.add(diskPlane);   // 俯视正看

// 盘面底部镜像 (侧看时也有厚度感)
const diskPlane2 = diskPlane.clone();
diskPlane2.rotation.x = Math.PI / 2;
diskPlane2.position.y = -0.4;
diskPlane2.material = diskPlane.material.clone();
diskPlane2.material.opacity = 0.6;
galaxyGroup.add(diskPlane2);

// ── 2. 立体核球 bulge (密集黄白老恒星, 扁球隆起) ──
{
  const N = 3000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    // 高斯径向分布, 扁球 (x,z 半径大, y 半径小)
    const r = Math.abs(rand(-1,1)) * 1.0;
    const scale = 6.5;
    const x = rand(-1,1), y = rand(-1,1), z = rand(-1,1);
    const len = Math.sqrt(x*x+y*y+z*z) || 1;
    const rr = r * scale;
    pos[i*3] = (x/len) * rr * 1.0;
    pos[i*3+1] = (y/len) * rr * 0.5;   // 扁球
    pos[i*3+2] = (z/len) * rr * 1.0;
    const warm = Math.random();
    const c = new THREE.Color(warm < 0.6 ? 0xffe9b0 : (warm < 0.85 ? 0xffd08a : 0xffc060));
    c.multiplyScalar(rand(0.55, 1.0));
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const bulge = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.5, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.95, depthWrite: false,
    blending: THREE.AdditiveBlending
  }));
  galaxyGroup.add(bulge);
}

// ── 3. 中央黑洞 (黑点, 不发光) ──
{
  const bhGeo = new THREE.SphereGeometry(0.6, 32, 32);
  const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const bh = new THREE.Mesh(bhGeo, bhMat);
  galaxyGroup.add(bh);
}

// ── 4. 银晕 + 恒星盘 (薄盘厚度, 侧看有立体感) ──
{
  const N = 25000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = -Math.log(1 - Math.random() * 0.999) * 9;
    if (r > 52) { pos[i*3]=pos[i*3+1]=pos[i*3+2]=0; col[i*3]=col[i*3+1]=col[i*3+2]=0; continue; }
    const th = Math.random() * Math.PI * 2;
    const y = rand(-1.2, 1.2) * (1 - r/60);
    pos[i*3] = r * Math.cos(th); pos[i*3+1] = y; pos[i*3+2] = r * Math.sin(th);
    const blue = Math.random() < 0.7;
    const c = new THREE.Color(blue ? 0xbdd0ff : 0xfff6e0).multiplyScalar(rand(0.35, 0.95));
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const halo = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.32, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.85, depthWrite: false,
    blending: THREE.AdditiveBlending
  }));
  galaxyGroup.add(halo);
}

// ── 可点击天体 ──
const clickables = [];
function makeMarker(pos, color, size, info) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), new THREE.MeshBasicMaterial({ color }));
  m.position.copy(pos); galaxyGroup.add(m);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: (() => { const c=document.createElement('canvas'); c.width=c.height=64;
      const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,2,32,32,32);
      gr.addColorStop(0,'rgba(255,255,255,0.9)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })(),
    transparent: true, depthWrite: false
  }));
  halo.scale.set(size*8, size*8, 1); m.add(halo);
  clickables.push({ mesh: m, info }); return m;
}
makeMarker(new THREE.Vector3(0,0,0), 0x000000, 1.2, {
  name: '银心黑洞 Sgr A*', sub: 'Galactic Center',
  rows: ['超大质量黑洞', '约 400 万太阳质量', '距太阳 26,000 光年', '银河系所有恒星绕它公转']
});
const SUN_R = 26, SUN_TH = 0.75 * Math.PI;
const sunPos = new THREE.Vector3(SUN_R*Math.cos(SUN_TH), 0, SUN_R*Math.sin(SUN_TH));
makeMarker(sunPos, 0xff3b30, 1.1, {
  name: '太阳 (我们在这里)', sub: 'Sun · Orion Spur',
  rows: ['G 型主序星', '位于猎户支臂', '距银心 26,000 光年', '绕银心 2.25 亿年一圈 (银河年)']
});

// ── 交互: 左键旋转 / 右键平移 / 滚轮缩放 ──
let action = null, prevX = 0, prevY = 0;
const panTarget = new THREE.Vector3(0, 0, 0);   // 注视点(可平移)
let rotY = 0.8, rotX = 0.42;                    // 绕盘面的轨道角
let viewDist = 160;

container.addEventListener('contextmenu', e => e.preventDefault());
container.addEventListener('mousedown', e => {
  action = (e.button === 2) ? 'rotate' : 'pan';
  prevX = e.clientX; prevY = e.clientY;
  container.classList.add('dragging');
});
window.addEventListener('mouseup', () => { action = null; container.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  if (!action) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  if (action === 'rotate') {
    rotY += dx * 0.005;
    rotX = Math.max(-1.45, Math.min(1.45, rotX + dy * 0.005));
  } else {  // 平移注视点
    const s = viewDist * 0.0015;
    // 相机右手方向与上方向的世界平移
    const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
    panTarget.addScaledVector(right, -dx * s);
    panTarget.addScaledVector(up, dy * s);
  }
  prevX = e.clientX; prevY = e.clientY;
});
container.addEventListener('wheel', e => {
  e.preventDefault();
  viewDist *= (e.deltaY > 0 ? 1.1 : 0.9);
  viewDist = Math.max(35, Math.min(800, viewDist));
}, { passive: false });

// 拾取点击
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
container.addEventListener('click', e => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = clickables.map(c => c.mesh);
  const hits = raycaster.intersectObjects(meshes, true);
  if (hits.length > 0) {
    const obj = hits[0].object;
    const entry = clickables.find(c => c.mesh === obj || c.mesh.children.includes(obj));
    if (entry) showInfo(entry.info);
  }
});
function showInfo(info) {
  tooltip.style.display = 'block';
  tooltip.style.left = '50%'; tooltip.style.top = '58%'; tooltip.style.transform = 'translateX(-50%)';
  tooltip.innerHTML = `<b style="font-size:15px;">${info.name}</b> · ${info.sub}<br>
    <span style="color:#888;font-size:12px;">${info.rows.slice(0,3).join('<br>')}</span><br>
    <span style="color:#aaa;font-size:12px;line-height:1.5;">${info.rows[3]}</span>`;
  setTimeout(() => tooltip.style.display = 'none', 6000);
}

// ── 时间流速 + 自转 (顺时针, 从北银极俯视) ──
const GALACTIC_YEAR = 2.25e8;
let simSpeed = 0;
document.querySelectorAll('.spd').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.spd').forEach(b => {
      b.classList.remove('active'); b.style.borderColor='rgba(255,255,255,0.2)'; b.style.background='transparent'; b.style.color='#aaa';
    });
    btn.classList.add('active'); btn.style.borderColor='#4fc3f7'; btn.style.background='rgba(79,195,247,0.2)'; btn.style.color='#4fc3f7';
    simSpeed = parseFloat(btn.dataset.s) || 0;
  });
});

// ── 动画循环 ──
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  // 星系自转: 顺时针(北银极俯视) → 视觉上 rotation.y 正向
  if (simSpeed > 0) {
    galaxyGroup.rotation.y -= (delta * simSpeed / GALACTIC_YEAR) * Math.PI * 2;
  }

  // 相机轨道定位
  camera.position.set(
    panTarget.x + viewDist * Math.sin(rotY) * Math.cos(rotX),
    panTarget.y + viewDist * Math.sin(rotX),
    panTarget.z + viewDist * Math.cos(rotY) * Math.cos(rotX)
  );
  camera.lookAt(panTarget);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('close-btn').onclick = () => {
  window.parent.postMessage({ type: 'close-galaxy-3d' }, '*');
};
</script>
</body>
</html>
