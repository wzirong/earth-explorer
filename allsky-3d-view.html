<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>全天已知星系 · 3D</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #container { position: fixed; inset: 0; cursor: grab; }
  #container.dragging { cursor: grabbing; }
  #info { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
          color: rgba(255,255,255,0.85); font: 600 16px sans-serif; letter-spacing: 2px;
          text-shadow: 0 2px 10px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; white-space: nowrap; }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
          color: rgba(255,255,255,0.45); font: 12px sans-serif; pointer-events: none; z-index: 10; white-space: nowrap; }
  #tooltip { position: fixed; background: rgba(20,22,28,0.95); color: #fff; padding: 10px 14px;
             border-radius: 8px; font-size: 13px; pointer-events: none; display: none; z-index: 100;
             border: 1px solid rgba(255,255,255,0.15); max-width: 320px; line-height: 1.5; }
  #close-btn { position: fixed; top: 14px; right: 16px; padding: 8px 16px;
               background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
               border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer; z-index: 20; font-weight: 600; }
  #close-btn:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div id="container"></div>
<div id="info">🌌 全天已知星系 · 3D (SIMBAD 2636 颗, 距离 0~0.86 Mpc)</div>
<div id="hint">🖱 左键平移 · 右键旋转(我们地球在中心) · 滚轮缩放</div>
<div id="tooltip"></div>
<button id="close-btn">← 返回地球</button>

<script src="three.min.js"></script>
<script src="CSS2DRenderer.js"></script>
<script>
let DATA = null;
fetch('data/allsky_3d.json').then(r=>r.json()).then(d => { DATA = d; init(); });

const container = document.getElementById('container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000006);

// 星空背景
const starField = new THREE.Points(
  new THREE.BufferGeometry(),
  new THREE.PointsMaterial({ color: 0x556677, size: 0.4, sizeAttenuation: false, transparent: true, opacity: 0.5 })
);
{
  const count = 1500, pos = new Float32Array(count*3);
  for (let i=0;i<count;i++){
    const r = 20 + Math.random()*30;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
  }
  starField.geometry.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(starField);
}

// 相机: 地球(我们)看全天 -- 模拟观测者视角 (z- 方向 = 远离我们)
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.001, 100);
camera.position.set(0, 0, 0.001);  // 地球位置(原点), 朝 -z 方向看
camera.lookAt(0, 0, -1);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.inset = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const LABEL_STYLE = { fontSize:'11px', color:'#fff', background:'rgba(15,20,30,0.7)', padding:'2px 7px',
  borderRadius:'8px', border:'1px solid rgba(120,180,255,0.4)', whiteSpace:'nowrap',
  fontFamily:'sans-serif', userSelect:'none', pointerEvents:'auto' };
function makeLabel(text, target, offsetY=0) {
  const el = document.createElement('div');
  el.textContent = text;
  Object.assign(el.style, LABEL_STYLE);
  const label = new THREE.CSS2DObject(el);
  label.position.set(0, offsetY, 0);
  target.add(label);
  return label;
}

const GROUP = new THREE.Group();
scene.add(GROUP);

// 缩放系数: 让 0.86 Mpc 的星系在屏幕里可见
// 原数据 1 unit = 1 Mpc. 太远. 放大 1000 倍: 1 unit = 0.001 Mpc
const SCALE = 1000;

function init() {
  // 全天星系 3D 球状分布 + z 起伏
  const N = DATA.length;
  // 抽稀到 ~2000 (避免太多)
  const positions = new Float32Array(N*3);
  const colors = new Float32Array(N*3);
  for (let i = 0; i < N; i++) {
    const g = DATA[i];
    // 添加 z 起伏增强 3D 立体感
    const zJitter = (Math.random() - 0.5) * 0.05;
    positions[i*3]   = g.x * SCALE;
    positions[i*3+1] = g.y * SCALE;
    positions[i*3+2] = (g.z + zJitter) * SCALE;
    // 颜色: 按距离 (近亮, 远暗), 按红移偏蓝(远)偏红(近)
    const t = Math.min(1, g.z * 5000);  // 红移→颜色
    const c = new THREE.Color().setHSL(0.6 - t*0.5, 0.5, 0.6 - Math.min(0.4, g.d*1.5));
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 4, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: 0.85, depthWrite: false
  });
  GROUP.add(new THREE.Points(geo, mat));

  // 标注一些著名星系 (本地星系群 + 附近大星系)
  const notable = ['M31', 'M33', 'M81', 'M82', 'NGC253', 'NGC5128', 'NGC4945'];
  DATA.forEach((g, i) => {
    const id = g.id;
    // SIMBAD id 可能是 "M 31" 带空格
    for (const n of notable) {
      if (id.replace(/\s/g, '') === n.replace(/\s/g, '')) {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(0.015, 12, 12),
          new THREE.MeshBasicMaterial({ color: 0xffd060 })
        );
        m.position.set(g.x*SCALE, g.y*SCALE, g.z*SCALE);
        GROUP.add(m);
        makeLabel(n + ` (${g.d.toFixed(2)} Mpc)`, m, 0.04);
        break;
      }
    }
  });
}

// ── 交互 ──
let action = null, prevX = 0, prevY = 0;
const panTarget = new THREE.Vector3(0, 0, -0.5*SCALE);
let rotY = 0, rotX = 0, viewDist = 1.2*SCALE;
container.addEventListener('contextmenu', e => e.preventDefault());
container.addEventListener('mousedown', e => {
  action = (e.button === 2) ? 'rotate' : 'pan';
  prevX = e.clientX; prevY = e.clientY;
  container.classList.add('dragging');
});
window.addEventListener('mouseup', () => { action = null; container.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  if (!action) return;
  const dx = e.clientX - prevX, dy = e.clientY - prevY;
  if (action === 'rotate') {
    rotY += dx * 0.005;
    rotX = Math.max(-1.45, Math.min(1.45, rotX + dy*0.005));
  } else {
    const s = viewDist * 0.0022;
    const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
    panTarget.addScaledVector(right, -dx*s);
    panTarget.addScaledVector(up, dy*s);
  }
  prevX = e.clientX; prevY = e.clientY;
});
container.addEventListener('wheel', e => {
  e.preventDefault();
  viewDist *= (e.deltaY > 0 ? 1.1 : 0.9);
  viewDist = Math.max(0.1*SCALE, Math.min(10*SCALE, viewDist));
}, { passive: false });

function animate() {
  requestAnimationFrame(animate);
  const dist = camera.position.distanceTo(panTarget);
  camera.position.set(
    panTarget.x + dist*Math.sin(rotY)*Math.cos(rotX),
    panTarget.y + dist*Math.sin(rotX),
    panTarget.z + dist*Math.cos(rotY)*Math.cos(rotX)
  );
  camera.lookAt(panTarget);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('close-btn').onclick = () => {
  if (window.parent) window.parent.postMessage({ type: 'close-allsky-3d' }, '*');
};
</script>
</body>
</html>
